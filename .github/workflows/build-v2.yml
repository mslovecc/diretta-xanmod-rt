name: Build Diretta ALSA Bridge - XanMod RT x64v2

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  DIRETTA_SOURCE_BASE: "https://gabe.babe123.top/DirettaAlsaHost"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            lld \
            llvm \
            gcc \
            g++ \
            make \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            dwarves \
            xz-utils \
            wget \
            curl \
            kmod \
            ca-certificates \
            gnupg

      - name: Add XanMod APT repository
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "ADD XANMOD APT REPOSITORY"
          echo "=========================================="

          sudo install -d -m 0755 /etc/apt/keyrings

          echo
          echo "Downloading XanMod repository key:"

          wget -q \
            "https://gabe.babe123.top/archive.key" \
            -O /tmp/xanmod-archive.key

          test -s /tmp/xanmod-archive.key

          echo
          echo "Installing XanMod repository key:"

          gpg \
            --dearmor \
            --yes \
            -o /tmp/xanmod-archive-keyring.gpg \
            /tmp/xanmod-archive.key

          sudo install \
            -m 0644 \
            /tmp/xanmod-archive-keyring.gpg \
            /etc/apt/keyrings/xanmod-archive-keyring.gpg

          echo
          echo "Adding XanMod repository:"

          echo \
            "deb [signed-by=/etc/apt/keyrings/xanmod-archive-keyring.gpg] http://deb.xanmod.org noble main" \
            | sudo tee /etc/apt/sources.list.d/xanmod-release.list

          echo
          echo "Updating APT:"

          sudo apt-get update

          echo
          echo "XanMod repository configured successfully."

      - name: Install XanMod RT x64v2 kernel
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "INSTALL XANMOD RT X64V2"
          echo "=========================================="

          sudo apt-get install -y \
            linux-xanmod-rt-x64v2

          echo
          echo "Installed XanMod packages:"

          dpkg -l | grep -E \
            'linux-(headers|image|xanmod-rt-x64v2)' \
            || true

      - name: Detect XanMod RT headers
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DETECT XANMOD RT HEADERS"
          echo "=========================================="

          echo
          echo "Available headers:"

          ls -ld \
            /usr/src/linux-headers-* \
            2>/dev/null || true

          echo
          echo "Installed XanMod packages:"

          dpkg -l | grep -E \
            'linux-(headers|image|xanmod-rt-x64v2)' \
            || true

          echo
          echo "Searching for XanMod RT x64v2 headers..."

          HEADER_DIR=""

          # 收集所有匹配的目录，并按版本排序，取最新一个
          mapfile -t CANDIDATES < <(
            ls -d /usr/src/linux-headers-*-rt-x64v2-xanmod* 2>/dev/null \
              | sort -V
          )

          if [ "${#CANDIDATES[@]}" -eq 0 ]; then
            echo
            echo "ERROR: XanMod RT x64v2 headers not found."
            echo
            echo "Available /usr/src directories:"

            find /usr/src \
              -maxdepth 1 \
              -type d \
              -name 'linux-*' \
              -print \
              | sort

            exit 1
          fi

          # 取最新（sort -V 后最后一个）
          HEADER_DIR="${CANDIDATES[-1]}"

          echo
          echo "All candidate header dirs:"

          printf '  %s\n' "${CANDIDATES[@]}"

          echo
          echo "Selected XanMod RT headers:"
          echo "${HEADER_DIR}"

          echo
          echo "Header directory:"
          ls -ld "${HEADER_DIR}"

          echo
          echo "Header Makefile:"
          ls -lh \
            "${HEADER_DIR}/Makefile"

          echo
          echo "Kernel release from headers:"

          ACTUAL_RELEASE="$(
            make \
              -s \
              -C "${HEADER_DIR}" \
              kernelrelease
          )"

          echo "${ACTUAL_RELEASE}"

          # 从完整 release 中提取 xanmod 完整版本号
          # 例如 6.18.55-rt-x64v2  ->  6.18.55-rt-x64v2-xanmod1
          XANMOD_FULL_RELEASE="$(
            dpkg-query -W -f='${Package}\n' \
              'linux-headers-*-rt-x64v2-xanmod*' \
              2>/dev/null \
              | sed 's/^linux-headers-//' \
              | sort -V \
              | tail -n1
          )"

          if [ -z "${XANMOD_FULL_RELEASE}" ]; then
            echo
            echo "ERROR: unable to determine XanMod full release from dpkg."
            exit 1
          fi

          echo
          echo "Detected XanMod full release:"
          echo "${XANMOD_FULL_RELEASE}"

          echo
          echo "=========================================="
          echo "XANMOD RT HEADERS VERIFIED"
          echo "=========================================="

          echo
          echo "Kernel headers:"
          echo "${HEADER_DIR}"

          echo
          echo "Kernel release:"
          echo "${ACTUAL_RELEASE}"

          echo
          echo "XanMod release:"
          echo "${XANMOD_FULL_RELEASE}"

          echo "KERNEL_DIR=${HEADER_DIR}" >> "${GITHUB_ENV}"
          echo "XANMOD_KERNEL_RELEASE=${XANMOD_FULL_RELEASE}" >> "${GITHUB_ENV}"

      - name: Verify installed XanMod modules
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFY XANMOD INSTALLED MODULES"
          echo "=========================================="

          echo
          echo "Detected XanMod release:"
          echo "${XANMOD_KERNEL_RELEASE}"

          echo
          echo "Searching installed XanMod modules..."

          if ! dpkg -l | grep -q \
            "linux-image-${XANMOD_KERNEL_RELEASE}"; then

            echo
            echo "ERROR: XanMod RT kernel image not installed."

            dpkg -l | grep -E \
              'linux-(headers|image|xanmod-rt-x64v2)' \
              || true

            exit 1
          fi

          if ! dpkg -l | grep -q \
            "linux-headers-${XANMOD_KERNEL_RELEASE}"; then

            echo
            echo "ERROR: XanMod RT headers package not installed."

            dpkg -l | grep -E \
              'linux-(headers|image|xanmod-rt-x64v2)' \
              || true

            exit 1
          fi

          echo
          echo "Installed XanMod packages:"

          dpkg -l | grep -E \
            'linux-(headers|image|xanmod-rt-x64v2)' \
            || true

          echo
          echo "XanMod installed modules verified."

      - name: Download Diretta ALSA Bridge source
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DOWNLOAD DIRETTA ALSA BRIDGE SOURCE"
          echo "=========================================="

          echo
          echo "Source base:"
          echo "${DIRETTA_SOURCE_BASE}"

          mkdir -p daphile-diretta-build

          cd daphile-diretta-build

          echo
          echo "Downloading required source files..."

          echo
          echo "Downloading:"
          echo "alsa_bridge.c"

          wget -q \
            "${DIRETTA_SOURCE_BASE}/alsa_bridge.c" \
            -O alsa_bridge.c

          echo
          echo "Downloading:"
          echo "alsa_bridge.h"

          wget -q \
            "${DIRETTA_SOURCE_BASE}/alsa_bridge.h" \
            -O alsa_bridge.h

          echo
          echo "Downloading:"
          echo "Makefile"

          wget -q \
            "${DIRETTA_SOURCE_BASE}/Makefile" \
            -O Makefile

          echo
          echo "Downloaded files:"

          ls -lh

          test -s alsa_bridge.c
          test -s alsa_bridge.h
          test -s Makefile

          echo
          echo "Diretta source download successful."

      - name: Show kernel build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "KERNEL BUILD ENVIRONMENT"
          echo "=========================================="

          echo
          echo "Kernel headers:"
          echo "${KERNEL_DIR}"

          echo
          echo "Kernel release:"
          make \
            -s \
            -C "${KERNEL_DIR}" \
            kernelrelease

          echo
          echo "Compiler:"

          clang --version

          echo
          echo "LLVM linker:"

          ld.lld --version | head -1

          echo
          echo "Kernel Makefile:"
          ls -lh "${KERNEL_DIR}/Makefile"

      - name: Build ALSA Bridge
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "BUILD ALSA_BRIDGE"
          echo "=========================================="

          echo
          echo "Kernel headers:"
          echo "${KERNEL_DIR}"

          echo
          echo "Kernel release:"

          make \
            -s \
            -C "${KERNEL_DIR}" \
            kernelrelease

          echo
          echo "Module source:"
          echo "${GITHUB_WORKSPACE}/daphile-diretta-build"

          echo
          echo "=== Makefile ==="

          cat \
            "${GITHUB_WORKSPACE}/daphile-diretta-build/Makefile"

          echo
          echo "=== BUILD ==="

          make \
            -C "${KERNEL_DIR}" \
            ARCH=x86_64 \
            LLVM=1 \
            M="${GITHUB_WORKSPACE}/daphile-diretta-build" \
            modules

      - name: Verify module
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFY ALSA_BRIDGE MODULE"
          echo "=========================================="

          KO="${GITHUB_WORKSPACE}/daphile-diretta-build/alsa_bridge.ko"

          echo
          echo "Module:"
          echo "${KO}"

          if [ ! -f "${KO}" ]; then
            echo
            echo "ERROR: alsa_bridge.ko was not created."
            exit 1
          fi

          echo
          echo "=== File ==="

          ls -lh "${KO}"

          file "${KO}"

          echo
          echo "=== modinfo ==="

          modinfo "${KO}"

          echo
          echo "=== vermagic ==="

          modinfo -F vermagic "${KO}"

          echo
          echo "=== module name ==="

          modinfo -F name "${KO}"

          if [ "$(modinfo -F name "${KO}")" != "alsa_bridge" ]; then
            echo
            echo "ERROR: unexpected module name."
            exit 1
          fi

          echo
          echo "ALSA Bridge module verified."

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "PREPARE RELEASE FILES"
          echo "=========================================="

          rm -rf release

          mkdir -p release

          cp \
            daphile-diretta-build/alsa_bridge.ko \
            release/alsa_bridge.ko

          cp \
            daphile-diretta-build/alsa_bridge.c \
            release/alsa_bridge.c

          cp \
            daphile-diretta-build/alsa_bridge.h \
            release/alsa_bridge.h

          cp \
            daphile-diretta-build/Makefile \
            release/Makefile

          make \
            -s \
            -C "${KERNEL_DIR}" \
            kernelrelease \
            > release/kernel.release

          echo
          echo "Release files:"

          ls -lh release

      - name: Create build info
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CREATE BUILD INFO"
          echo "=========================================="

          KERNEL_RELEASE_ACTUAL="$(
            cat release/kernel.release
          )"

          COMPILER_VERSION="$(
            clang --version | head -1
          )"

          BUILD_DATE="$(
            date -u '+%Y-%m-%d %H:%M:%S UTC'
          )"

          printf '%s\n' \
            "Linux kernel package: ${XANMOD_KERNEL_RELEASE}" \
            "Kernel release: ${KERNEL_RELEASE_ACTUAL}" \
            "Module: alsa_bridge" \
            "Compiler: ${COMPILER_VERSION}" \
            "Build mode: LLVM=1" \
            "Architecture: x86_64" \
            "Diretta source: ${DIRETTA_SOURCE_BASE}" \
            "Build date: ${BUILD_DATE}" \
            > release/build-info.txt

          echo
          echo "=== build-info.txt ==="

          cat release/build-info.txt

      - name: Create checksum
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CREATE SHA256"
          echo "=========================================="

          cd release

          sha256sum \
            alsa_bridge.ko \
            alsa_bridge.c \
            alsa_bridge.h \
            Makefile \
            kernel.release \
            build-info.txt \
            > SHA256SUMS

          echo
          echo "=== SHA256SUMS ==="

          cat SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: alsa-bridge-${{ env.XANMOD_KERNEL_RELEASE }}
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.XANMOD_KERNEL_RELEASE }}-${{ github.run_number }}
          name: "Diretta ALSA Bridge - ${{ env.XANMOD_KERNEL_RELEASE }}"
          body_path: release/build-info.txt
          files: |
            release/alsa_bridge.ko
            release/alsa_bridge.c
            release/alsa_bridge.h
            release/Makefile
            release/kernel.release
            release/build-info.txt
            release/SHA256SUMS
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show final files
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "BUILD SUCCESS"
          echo "=========================================="

          echo
          echo "=== Release files ==="

          ls -lh release

          echo
          echo "=== Kernel release ==="

          cat release/kernel.release

          echo
          echo "=== Module info ==="

          modinfo release/alsa_bridge.ko

          echo
          echo "=== Module vermagic ==="

          modinfo -F vermagic release/alsa_bridge.ko

          echo
          echo "=========================================="
          echo "ALSA_BRIDGE BUILD COMPLETED"
          echo "=========================================="
