name: Build Diretta ALSA Bridge for XanMod RT x64v2

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  XANMOD_PACKAGE: "linux-xanmod-rt-x64v2"
  XANMOD_REPO: "http://deb.xanmod.org"
  XANMOD_KEY_URL: "https://gabe.babe123.top/archive.key"
  DIRETTA_BASE_URL: "https://gabe.babe123.top/DirettaAlsaHost/"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Ubuntu version
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "UBUNTU ENVIRONMENT"
          echo "=========================================="

          cat /etc/os-release

          echo
          echo "Kernel:"
          uname -a

          echo
          echo "Architecture:"
          uname -m

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "INSTALL BUILD DEPENDENCIES"
          echo "=========================================="

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            make \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            dwarves \
            dkms \
            kmod \
            curl \
            wget \
            ca-certificates \
            gnupg \
            file \
            xz-utils \
            zstd \
            rsync

      - name: Add XanMod APT repository
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "ADD XANMOD APT REPOSITORY"
          echo "=========================================="

          sudo mkdir -p /etc/apt/keyrings

          echo
          echo "Downloading repository key from:"
          echo "${XANMOD_KEY_URL}"

          wget \
            -q \
            --show-progress \
            "${XANMOD_KEY_URL}" \
            -O /tmp/xanmod-archive.key

          echo
          echo "Key file:"
          ls -lh /tmp/xanmod-archive.key

          echo
          echo "Converting keyring..."

          sudo gpg \
            --batch \
            --yes \
            --dearmor \
            -o /etc/apt/keyrings/xanmod-archive-keyring.gpg \
            /tmp/xanmod-archive.key

          echo
          echo "Keyring:"
          ls -lh /etc/apt/keyrings/xanmod-archive-keyring.gpg

          echo
          echo "Detect Ubuntu codename..."

          CODENAME="$(. /etc/os-release && echo "${VERSION_CODENAME}")"

          echo "Ubuntu codename:"
          echo "${CODENAME}"

          if [ -z "${CODENAME}" ]; then
            echo "ERROR: Ubuntu codename could not be detected."
            exit 1
          fi

          echo
          echo "Create XanMod repository..."

          echo \
            "deb [signed-by=/etc/apt/keyrings/xanmod-archive-keyring.gpg] ${XANMOD_REPO} ${CODENAME} main" \
            | sudo tee /etc/apt/sources.list.d/xanmod-release.list

          echo
          echo "Repository configuration:"
          cat /etc/apt/sources.list.d/xanmod-release.list

          echo
          echo "=========================================="
          echo "APT UPDATE"
          echo "=========================================="

          sudo apt-get update

      - name: Install XanMod RT x64v2
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "INSTALL XANMOD RT x64v2"
          echo "=========================================="

          sudo apt-get install -y \
            "${XANMOD_PACKAGE}"

          echo
          echo "=========================================="
          echo "INSTALLED XANMOD PACKAGES"
          echo "=========================================="

          dpkg -l | grep -E \
            'linux-(xanmod|image|headers).*xanmod' \
            || true

      - name: Detect XanMod RT kernel
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DETECT XANMOD RT KERNEL"
          echo "=========================================="

          echo
          echo "Installed XanMod packages:"
          dpkg -l | grep -E \
            'linux-(xanmod|image|headers).*xanmod' \
            || true

          echo
          echo "Installed module directories:"
          ls -1 /lib/modules/ || true

          echo
          echo "Installed headers:"
          ls -ld /usr/src/linux-headers-* 2>/dev/null || true

          echo
          echo "=========================================="
          echo "FIND XANMOD RT KERNEL"
          echo "=========================================="

          KERNEL_RELEASE=""

          KERNEL_RELEASE="$(
            find /lib/modules \
              -maxdepth 1 \
              -mindepth 1 \
              -type d \
              -printf '%f\n' \
              | grep 'rt-x64v2-xanmod' \
              | sort -V \
              | tail -1
          )"

          if [ -z "${KERNEL_RELEASE}" ]; then
            echo
            echo "ERROR: XanMod RT x64v2 kernel was not found."
            echo
            echo "Available kernels:"
            ls -1 /lib/modules/ || true
            exit 1
          fi

          echo
          echo "Detected kernel release:"
          echo "${KERNEL_RELEASE}"

          KERNEL_HEADERS="/usr/src/linux-headers-${KERNEL_RELEASE}"

          echo
          echo "Expected headers:"
          echo "${KERNEL_HEADERS}"

          if [ ! -d "${KERNEL_HEADERS}" ]; then
            echo
            echo "ERROR: XanMod RT headers not found:"
            echo "${KERNEL_HEADERS}"

            echo
            echo "Available headers:"
            ls -ld /usr/src/linux-headers-* 2>/dev/null || true

            exit 1
          fi

          echo
          echo "=========================================="
          echo "XANMOD RT KERNEL FOUND"
          echo "=========================================="

          echo
          echo "Kernel release:"
          echo "${KERNEL_RELEASE}"

          echo
          echo "Kernel modules:"
          echo "/lib/modules/${KERNEL_RELEASE}"

          echo
          echo "Kernel headers:"
          echo "${KERNEL_HEADERS}"

          echo
          echo "Kernel Makefile:"
          ls -lh \
            "${KERNEL_HEADERS}/Makefile"

          echo
          echo "=========================================="
          echo "EXPORT KERNEL VARIABLES"
          echo "=========================================="

          echo \
            "KERNEL_RELEASE=${KERNEL_RELEASE}" \
            >> "${GITHUB_ENV}"

          echo \
            "KERNEL_HEADERS=${KERNEL_HEADERS}" \
            >> "${GITHUB_ENV}"

          echo
          echo "KERNEL_RELEASE=${KERNEL_RELEASE}"
          echo "KERNEL_HEADERS=${KERNEL_HEADERS}"

      - name: Verify XanMod kernel headers
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFY XANMOD RT HEADERS"
          echo "=========================================="

          echo
          echo "Kernel release:"
          echo "${KERNEL_RELEASE}"

          echo
          echo "Headers:"
          echo "${KERNEL_HEADERS}"

          test -d "${KERNEL_HEADERS}"

          test -f "${KERNEL_HEADERS}/Makefile"

          echo
          echo "Kernel Makefile:"
          grep -E \
            '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)' \
            "${KERNEL_HEADERS}/Makefile" \
            || true

          echo
          echo "Kernel configuration:"
          if [ -f "${KERNEL_HEADERS}/.config" ]; then
            ls -lh "${KERNEL_HEADERS}/.config"
          else
            echo "No .config in header tree"
          fi

          echo
          echo "Generated configuration:"
          if [ -f "${KERNEL_HEADERS}/include/config/auto.conf" ]; then
            ls -lh \
              "${KERNEL_HEADERS}/include/config/auto.conf"
          else
            echo "No include/config/auto.conf"
          fi

          echo
          echo "Headers verification completed."

      - name: Download Diretta ALSA Bridge source
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DOWNLOAD DIRETTA ALSA BRIDGE SOURCE"
          echo "=========================================="

          echo
          echo "Source URL:"
          echo "${DIRETTA_BASE_URL}"

          rm -rf diretta-source

          mkdir -p diretta-source

          echo
          echo "Downloading source directory..."

          wget \
            -q \
            --show-progress \
            --mirror \
            --no-parent \
            --no-host-directories \
            --cut-dirs=1 \
            "${DIRETTA_BASE_URL}" \
            -P diretta-source

          echo
          echo "Downloaded files:"
          find diretta-source \
            -type f \
            -print \
            | sort

      - name: Locate alsa_bridge source
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "LOCATE ALSA BRIDGE SOURCE"
          echo "=========================================="

          echo
          echo "Searching for Makefile..."

          MAKEFILE_PATH="$(
            find diretta-source \
              -type f \
              -name Makefile \
              | grep -E 'alsa|diretta' \
              | head -1 \
              || true
          )"

          if [ -z "${MAKEFILE_PATH}" ]; then
            echo
            echo "ERROR: alsa_bridge Makefile not found."

            echo
            echo "All downloaded files:"
            find diretta-source \
              -type f \
              -print \
              | sort

            exit 1
          fi

          MODULE_DIR="$(dirname "${MAKEFILE_PATH}")"

          echo
          echo "Makefile:"
          echo "${MAKEFILE_PATH}"

          echo
          echo "Module directory:"
          echo "${MODULE_DIR}"

          if [ ! -f "${MODULE_DIR}/alsa_bridge.c" ]; then
            echo
            echo "ERROR: alsa_bridge.c not found."

            echo
            echo "Module directory contents:"
            find "${MODULE_DIR}" \
              -maxdepth 2 \
              -type f \
              -print \
              | sort

            exit 1
          fi

          echo
          echo "alsa_bridge source files:"
          find "${MODULE_DIR}" \
            -maxdepth 2 \
            -type f \
            -print \
            | sort

          echo
          echo "=========================================="
          echo "EXPORT MODULE DIRECTORY"
          echo "=========================================="

          echo \
            "MODULE_DIR=${MODULE_DIR}" \
            >> "${GITHUB_ENV}"

      - name: Show Diretta Makefile
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DIRETTA MAKEFILE"
          echo "=========================================="

          cat "${MODULE_DIR}/Makefile"

      - name: Build alsa_bridge
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "BUILD ALSA_BRIDGE.KO"
          echo "=========================================="

          echo
          echo "Kernel release:"
          echo "${KERNEL_RELEASE}"

          echo
          echo "Kernel headers:"
          echo "${KERNEL_HEADERS}"

          echo
          echo "Module source:"
          echo "${MODULE_DIR}"

          echo
          echo "=========================================="
          echo "BUILD"
          echo "=========================================="

          make \
            -C "${KERNEL_HEADERS}" \
            ARCH=x86_64 \
            CC=gcc \
            M="${GITHUB_WORKSPACE}/${MODULE_DIR}" \
            modules

      - name: Verify module
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFY ALSA_BRIDGE MODULE"
          echo "=========================================="

          KO="${GITHUB_WORKSPACE}/${MODULE_DIR}/alsa_bridge.ko"

          echo
          echo "Expected module:"
          echo "${KO}"

          if [ ! -f "${KO}" ]; then
            echo
            echo "ERROR: alsa_bridge.ko was not created."

            echo
            echo "Module directory:"
            find "${MODULE_DIR}" \
              -maxdepth 2 \
              -type f \
              -print \
              | sort

            exit 1
          fi

          echo
          echo "Module:"
          ls -lh "${KO}"

          echo
          echo "File:"
          file "${KO}"

          echo
          echo "=========================================="
          echo "MODINFO"
          echo "=========================================="

          modinfo "${KO}"

          echo
          echo "=========================================="
          echo "VERMAGIC"
          echo "=========================================="

          MODULE_VERMAGIC="$(
            modinfo -F vermagic "${KO}"
          )"

          echo "${MODULE_VERMAGIC}"

          echo
          echo "Expected kernel:"
          echo "${KERNEL_RELEASE}"

          case "${MODULE_VERMAGIC}" in
            "${KERNEL_RELEASE}"\ *)
              echo
              echo "VERMAGIC KERNEL VERSION MATCHES."
              ;;
            *)
              echo
              echo "ERROR: vermagic does not match XanMod kernel."
              echo
              echo "Module vermagic:"
              echo "${MODULE_VERMAGIC}"
              echo
              echo "Expected prefix:"
              echo "${KERNEL_RELEASE}"
              exit 1
              ;;
          esac

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "PREPARE RELEASE"
          echo "=========================================="

          rm -rf release

          mkdir -p release

          KO="${GITHUB_WORKSPACE}/${MODULE_DIR}/alsa_bridge.ko"

          cp \
            "${KO}" \
            release/alsa_bridge.ko

          cp \
            "${MODULE_DIR}/alsa_bridge.c" \
            release/alsa_bridge.c

          if [ -f "${MODULE_DIR}/alsa_bridge.h" ]; then
            cp \
              "${MODULE_DIR}/alsa_bridge.h" \
              release/alsa_bridge.h
          fi

          cp \
            "${MODULE_DIR}/Makefile" \
            release/Makefile

          printf '%s\n' \
            "${KERNEL_RELEASE}" \
            > release/kernel.release

          echo
          echo "Release files:"
          ls -lh release

      - name: Create build information
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CREATE BUILD INFO"
          echo "=========================================="

          COMPILER_VERSION="$(
            gcc --version \
            | head -1
          )"

          BUILD_DATE="$(
            date -u '+%Y-%m-%d %H:%M:%S UTC'
          )"

          MODULE_VERMAGIC="$(
            modinfo \
              -F vermagic \
              release/alsa_bridge.ko
          )"

          printf '%s\n' \
            "Kernel release: ${KERNEL_RELEASE}" \
            "Kernel package: ${XANMOD_PACKAGE}" \
            "Kernel headers: ${KERNEL_HEADERS}" \
            "Module: alsa_bridge" \
            "Module vermagic: ${MODULE_VERMAGIC}" \
            "Architecture: x86_64" \
            "Compiler: ${COMPILER_VERSION}" \
            "Diretta source: ${DIRETTA_BASE_URL}" \
            "Build date: ${BUILD_DATE}" \
            > release/build-info.txt

          echo
          cat release/build-info.txt

      - name: Create SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CREATE SHA256"
          echo "=========================================="

          cd release

          sha256sum \
            alsa_bridge.ko \
            alsa_bridge.c \
            Makefile \
            kernel.release \
            build-info.txt \
            > SHA256SUMS

          if [ -f alsa_bridge.h ]; then
            sha256sum \
              alsa_bridge.h \
              >> SHA256SUMS
          fi

          echo
          cat SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: alsa-bridge-${{ env.XANMOD_PACKAGE }}-${{ env.KERNEL_RELEASE }}
          path: release

      - name: Final verification
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "FINAL BUILD RESULT"
          echo "=========================================="

          echo
          echo "Kernel:"
          echo "${KERNEL_RELEASE}"

          echo
          echo "Headers:"
          echo "${KERNEL_HEADERS}"

          echo
          echo "Module:"
          ls -lh release/alsa_bridge.ko

          echo
          echo "Vermagic:"
          modinfo \
            -F vermagic \
            release/alsa_bridge.ko

          echo
          echo "=========================================="
          echo "RELEASE FILES"
          echo "=========================================="

          ls -lh release

          echo
          echo "=========================================="
          echo "BUILD SUCCESS"
          echo "=========================================="
