name: Build Diretta ALSA Bridge for XanMod RT x64v2

on:
workflow_dispatch:

permissions:
contents: read

env:
XANMOD_KERNEL: "linux-xanmod-rt-x64v2"
DIRETTA_URL: "https://gabe.babe123.top/DirettaAlsaHost/"

jobs:

build:

runs-on: ubuntu-24.04

steps:

  # ============================================================
  # Checkout
  # ============================================================

  - name: Checkout
    uses: actions/checkout@v4


  # ============================================================
  # Install basic dependencies
  # ============================================================

  - name: Install build dependencies
    run: |
      set -euo pipefail

      echo "=========================================="
      echo "Install build dependencies"
      echo "=========================================="

      sudo apt-get update

      sudo apt-get install -y \
        build-essential \
        gcc \
        g++ \
        make \
        bc \
        bison \
        flex \
        libssl-dev \
        libelf-dev \
        dwarves \
        xz-utils \
        wget \
        curl \
        ca-certificates \
        kmod \
        file \
        gnupg


  # ============================================================
  # Add XanMod APT repository
  #
  # IMPORTANT:
  # Do NOT download xanmod-repository.deb.
  #
  # dl.xanmod.org/xanmod-repository.deb can return
  # Cloudflare HTTP 403 to GitHub Actions.
  #
  # Use the official repository configuration directly.
  # ============================================================

  - name: Add XanMod APT repository
    shell: bash
    run: |
      set -euo pipefail

      echo "=========================================="
      echo "Add XanMod APT repository"
      echo "=========================================="

      sudo install -d -m 0755 /etc/apt/keyrings

      echo
      echo "Downloading XanMod archive key..."

      wget \
        --https-only \
        --timeout=30 \
        --tries=3 \
        -O /tmp/xanmod-archive.key \
        https://dl.xanmod.org/archive.key

      echo
      echo "Checking XanMod key..."

      test -s /tmp/xanmod-archive.key

      file /tmp/xanmod-archive.key

      echo
      echo "Creating keyring..."

      sudo gpg \
        --batch \
        --yes \
        --dearmor \
        -o /etc/apt/keyrings/xanmod-archive-keyring.gpg \
        /tmp/xanmod-archive.key

      sudo chmod 0644 \
        /etc/apt/keyrings/xanmod-archive-keyring.gpg

      echo
      echo "XanMod keyring:"
      ls -lh /etc/apt/keyrings/xanmod-archive-keyring.gpg

      echo
      echo "Adding XanMod repository..."

      echo \
        "deb [signed-by=/etc/apt/keyrings/xanmod-archive-keyring.gpg] http://deb.xanmod.org noble main" \
        | sudo tee /etc/apt/sources.list.d/xanmod-release.list

      echo
      echo "Repository configuration:"
      cat /etc/apt/sources.list.d/xanmod-release.list


  # ============================================================
  # Update APT
  # ============================================================

  - name: Update APT
    run: |
      set -euo pipefail

      echo "=========================================="
      echo "APT UPDATE"
      echo "=========================================="

      sudo apt-get update


  # ============================================================
  # Check XanMod RT package
  # ============================================================

  - name: Check XanMod RT package
    run: |
      set -euo pipefail

      echo "=========================================="
      echo "CHECK XANMOD RT PACKAGE"
      echo "=========================================="

      echo
      echo "Package:"
      echo "${XANMOD_KERNEL}"

      echo
      echo "APT candidate:"

      apt-cache policy \
        "${XANMOD_KERNEL}"

      echo
      echo "Available XanMod RT packages:"

      apt-cache search \
        '^linux-xanmod-rt-x64v2$' \
        || true


  # ============================================================
  # Install XanMod RT kernel + headers
  #
  # The kernel package depends on / installs its matching
  # headers package.
  # ============================================================

  - name: Install XanMod RT kernel
    shell: bash
    run: |
      set -euo pipefail

      echo "=========================================="
      echo "Install XanMod RT x64v2"
      echo "=========================================="

      sudo apt-get install -y \
        "${XANMOD_KERNEL}"


  # ============================================================
  # Show installed XanMod packages
  # ============================================================

  - name: Show installed XanMod packages
    run: |
      set -euo pipefail

      echo "=========================================="
      echo "INSTALLED XANMOD PACKAGES"
      echo "=========================================="

      dpkg-query \
        -W \
        -f='${Package}\t${Version}\n' \
        | grep xanmod \
        || true

      echo
      echo "=========================================="
      echo "INSTALLED KERNELS"
      echo "=========================================="

      dpkg -l \
        | grep \
          -E 'linux-(image|headers).*xanmod' \
        || true


  # ============================================================
  # Detect running/installed XanMod kernel release
  #
  # GitHub runner itself does NOT boot the newly installed
  # XanMod kernel.
  #
  # Therefore uname -r must NOT be used as the build target.
  #
  # We determine the target from installed headers instead.
  # ============================================================

  - name: Detect XanMod kernel headers
    shell: bash
    run: |
      set -euo pipefail

      echo "=========================================="
      echo "DETECT XANMOD KERNEL HEADERS"
      echo "=========================================="

      echo
      echo "Installed /usr/src entries:"

      ls -ld \
        /usr/src/linux-headers-* \
        2>/dev/null \
        || true

      echo
      echo "Searching for XanMod RT headers..."

      mapfile -t HEADERS < <(
        find /usr/src \
          -maxdepth 1 \
          -type d \
          -name 'linux-headers-*-xanmod-rt*' \
          | sort
      )

      if [ "${#HEADERS[@]}" -eq 0 ]; then
        echo
        echo "ERROR: XanMod RT kernel headers were not found."
        echo
        echo "Installed kernel packages:"
        dpkg -l | grep xanmod || true
        exit 1
      fi

      echo
      echo "Found headers:"

      printf '%s\n' "${HEADERS[@]}"

      KERNEL_HEADERS="${HEADERS[0]}"

      echo
      echo "Selected headers:"
      echo "${KERNEL_HEADERS}"

      echo \
        "KERNEL_HEADERS=${KERNEL_HEADERS}" \
        >> "${GITHUB_ENV}"

      KERNEL_RELEASE="$(basename "${KERNEL_HEADERS}" | sed 's/^linux-headers-//')"

      echo
      echo "Detected kernel release:"
      echo "${KERNEL_RELEASE}"

      echo \
        "KERNEL_RELEASE=${KERNEL_RELEASE}" \
        >> "${GITHUB_ENV}"


  # ============================================================
  # Verify headers
  # ============================================================

  - name: Verify XanMod headers
    shell: bash
    run: |
      set -euo pipefail

      echo "=========================================="
      echo "VERIFY XANMOD HEADERS"
      echo "=========================================="

      echo
      echo "KERNEL_RELEASE:"
      echo "${KERNEL_RELEASE}"

      echo
      echo "KERNEL_HEADERS:"
      echo "${KERNEL_HEADERS}"

      echo
      echo "Header directory:"
      ls -ld "${KERNEL_HEADERS}"

      echo
      echo "Required files:"

      test -e \
        "${KERNEL_HEADERS}/Makefile"

      test -e \
        "${KERNEL_HEADERS}/Module.symvers"

      test -e \
        "${KERNEL_HEADERS}/include"

      echo "Header tree looks valid."

      echo
      echo "Kernel Makefile:"
      ls -lh \
        "${KERNEL_HEADERS}/Makefile"

      echo
      echo "Module.symvers:"
      ls -lh \
        "${KERNEL_HEADERS}/Module.symvers"


  # ============================================================
  # Download Diretta ALSA Host source
  #
  # Source is NOT taken from repository 2.
  # ============================================================

  - name: Download Diretta ALSA Host source
    shell: bash
    run: |
      set -euo pipefail

      echo "=========================================="
      echo "Download Diretta ALSA Host source"
      echo "=========================================="

      echo
      echo "Source URL:"
      echo "${DIRETTA_URL}"

      rm -rf \
        daphile-diretta-build

      mkdir -p \
        daphile-diretta-build

      echo
      echo "Downloading directory listing..."

      wget \
        --https-only \
        --timeout=30 \
        --tries=3 \
        -q \
        -O /tmp/diretta-index.html \
        "${DIRETTA_URL}"

      echo
      echo "Directory listing:"
      cat /tmp/diretta-index.html

      echo
      echo "=========================================="
      echo "Locate ALSA bridge source"
      echo "=========================================="


  # ============================================================
  # Download required source files
  #
  # These are the files used successfully in repository 2.
  # ============================================================

  - name: Download alsa_bridge source
    shell: bash
    run: |
      set -euo pipefail

      echo "=========================================="
      echo "Download alsa_bridge source"
      echo "=========================================="

      cd daphile-diretta-build

      wget \
        --https-only \
        --timeout=30 \
        --tries=3 \
        -O alsa_bridge.c \
        "${DIRETTA_URL}alsa_bridge.c"

      wget \
        --https-only \
        --timeout=30 \
        --tries=3 \
        -O alsa_bridge.h \
        "${DIRETTA_URL}alsa_bridge.h"

      wget \
        --https-only \
        --timeout=30 \
        --tries=3 \
        -O Makefile \
        "${DIRETTA_URL}Makefile"

      echo
      echo "Downloaded files:"
      ls -lh

      echo
      echo "=========================================="
      echo "Makefile"
      echo "=========================================="

      cat Makefile


  # ============================================================
  # Verify Diretta source
  # ============================================================

  - name: Verify Diretta source
    shell: bash
    run: |
      set -euo pipefail

      echo "=========================================="
      echo "VERIFY DIRETTA SOURCE"
      echo "=========================================="

      cd daphile-diretta-build

      test -s alsa_bridge.c
      test -s alsa_bridge.h
      test -s Makefile

      echo
      echo "Source files:"
      find . \
        -maxdepth 1 \
        -type f \
        -printf '%f\t%k KB\n' \
        | sort

      echo
      echo "Source verification completed."


  # ============================================================
  # Build alsa_bridge
  #
  # IMPORTANT:
  # Build against XanMod RT headers, NOT the GitHub runner
  # kernel.
  # ============================================================

  - name: Build alsa_bridge.ko
    shell: bash
    run: |
      set -euo pipefail

      echo "=========================================="
      echo "BUILD alsa_bridge.ko"
      echo "=========================================="

      echo
      echo "Target kernel:"
      echo "${KERNEL_RELEASE}"

      echo
      echo "Kernel headers:"
      echo "${KERNEL_HEADERS}"

      echo
      echo "Compiler:"
      gcc --version | head -1

      echo
      echo "=========================================="
      echo "Build"
      echo "=========================================="

      make \
        -C "${KERNEL_HEADERS}" \
        ARCH=x86_64 \
        CC=gcc \
        M="${GITHUB_WORKSPACE}/daphile-diretta-build" \
        modules

      echo
      echo "Build completed."


  # ============================================================
  # Verify module
  # ============================================================

  - name: Verify alsa_bridge module
    shell: bash
    run: |
      set -euo pipefail

      echo "=========================================="
      echo "VERIFY alsa_bridge.ko"
      echo "=========================================="

      KO="${GITHUB_WORKSPACE}/daphile-diretta-build/alsa_bridge.ko"

      if [ ! -f "${KO}" ]; then
        echo
        echo "ERROR: alsa_bridge.ko was not created."
        exit 1
      fi

      echo
      echo "Module:"
      ls -lh "${KO}"

      echo
      echo "File:"
      file "${KO}"

      echo
      echo "=========================================="
      echo "MODINFO"
      echo "=========================================="

      modinfo "${KO}"

      echo
      echo "=========================================="
      echo "VERMAGIC"
      echo "=========================================="

      VERMAGIC="$(modinfo -F vermagic "${KO}")"

      echo "${VERMAGIC}"

      echo
      echo "Expected kernel:"
      echo "${KERNEL_RELEASE}"


  # ============================================================
  # Verify vermagic contains XanMod RT kernel release
  # ============================================================

  - name: Verify module vermagic
    shell: bash
    run: |
      set -euo pipefail

      echo "=========================================="
      echo "VERIFY MODULE VERMAGIC"
      echo "=========================================="

      KO="${GITHUB_WORKSPACE}/daphile-diretta-build/alsa_bridge.ko"

      VERMAGIC="$(modinfo -F vermagic "${KO}")"

      echo
      echo "Kernel release:"
      echo "${KERNEL_RELEASE}"

      echo
      echo "Module vermagic:"
      echo "${VERMAGIC}"

      echo
      echo "Checking..."

      case "${VERMAGIC}" in
        "${KERNEL_RELEASE}"*)
          echo
          echo "VERMAGIC MATCH."
          ;;
        *)
          echo
          echo "ERROR: vermagic does not match XanMod kernel."
          echo
          echo "Expected prefix:"
          echo "${KERNEL_RELEASE}"
          echo
          echo "Actual:"
          echo "${VERMAGIC}"
          exit 1
          ;;
      esac


  # ============================================================
  # Prepare release
  # ============================================================

  - name: Prepare release files
    shell: bash
    run: |
      set -euo pipefail

      echo "=========================================="
      echo "PREPARE RELEASE"
      echo "=========================================="

      rm -rf release

      mkdir -p release

      cp \
        daphile-diretta-build/alsa_bridge.ko \
        release/alsa_bridge.ko

      cp \
        daphile-diretta-build/alsa_bridge.c \
        release/alsa_bridge.c

      cp \
        daphile-diretta-build/alsa_bridge.h \
        release/alsa_bridge.h

      cp \
        daphile-diretta-build/Makefile \
        release/Makefile

      printf '%s\n' \
        "${KERNEL_RELEASE}" \
        > release/kernel.release

      echo
      echo "Release files:"
      ls -lh release


  # ============================================================
  # Create build information
  # ============================================================

  - name: Create build info
    shell: bash
    run: |
      set -euo pipefail

      echo "=========================================="
      echo "CREATE BUILD INFO"
      echo "=========================================="

      VERMAGIC="$(modinfo -F vermagic release/alsa_bridge.ko)"

      COMPILER_VERSION="$(gcc --version | head -1)"

      BUILD_DATE="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"

      printf '%s\n' \
        "Module: alsa_bridge" \
        "Kernel: XanMod RT x64v2" \
        "Kernel release: ${KERNEL_RELEASE}" \
        "Kernel headers: ${KERNEL_HEADERS}" \
        "Vermagic: ${VERMAGIC}" \
        "Diretta source: ${DIRETTA_URL}" \
        "Compiler: ${COMPILER_VERSION}" \
        "Build date: ${BUILD_DATE}" \
        "Runner: ubuntu-24.04" \
        > release/build-info.txt

      echo
      cat release/build-info.txt


  # ============================================================
  # SHA256
  # ============================================================

  - name: Create SHA256 checksums
    shell: bash
    run: |
      set -euo pipefail

      echo "=========================================="
      echo "SHA256"
      echo "=========================================="

      cd release

      sha256sum \
        alsa_bridge.ko \
        alsa_bridge.c \
        alsa_bridge.h \
        Makefile \
        kernel.release \
        build-info.txt \
        > SHA256SUMS

      cat SHA256SUMS


  # ============================================================
  # Upload artifact
  # ============================================================

  - name: Upload artifact
    uses: actions/upload-artifact@v4
    with:
      name: alsa-bridge-xanmod-rt-x64v2
      path: release


  # ============================================================
  # Final verification
  # ============================================================

  - name: Final verification
    shell: bash
    run: |
      set -euo pipefail

      echo "=========================================="
      echo "BUILD SUCCESS"
      echo "=========================================="

      echo
      echo "Kernel:"
      cat release/kernel.release

      echo
      echo "Module:"
      ls -lh release/alsa_bridge.ko

      echo
      echo "Vermagic:"
      modinfo -F vermagic release/alsa_bridge.ko

      echo
      echo "=========================================="
      echo "RELEASE FILES"
      echo "=========================================="

      ls -lh release

      echo
      echo "=========================================="
      echo "alsa_bridge.ko BUILD COMPLETED"
      echo "=========================================="
