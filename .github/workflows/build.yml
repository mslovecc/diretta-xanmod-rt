name: Build Diretta ALSA Bridge - XanMod RT x64v2

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  XANMOD_KERNEL: "linux-xanmod-rt-x64v2"
  DIRETTA_URL: "https://gabe.babe123.top/DirettaAlsaHost"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Install build dependencies"
          echo "=========================================="

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            make \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            dwarves \
            xz-utils \
            wget \
            curl \
            ca-certificates \
            kmod \
            file \
            gnupg

      - name: Add XanMod APT repository
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Add XanMod APT repository"
          echo "=========================================="

          sudo install -d -m 0755 /etc/apt/keyrings

          echo "Downloading XanMod archive key..."

          wget \
            --https-only \
            --timeout=30 \
            --tries=3 \
            -O /tmp/xanmod-archive.key \
            https://dl.xanmod.org/archive.key

          test -s /tmp/xanmod-archive.key

          echo "Converting XanMod key..."

          sudo gpg \
            --batch \
            --yes \
            --dearmor \
            -o /etc/apt/keyrings/xanmod-archive-keyring.gpg \
            /tmp/xanmod-archive.key

          sudo chmod 0644 \
            /etc/apt/keyrings/xanmod-archive-keyring.gpg

          echo "Adding XanMod repository..."

          echo "deb [signed-by=/etc/apt/keyrings/xanmod-archive-keyring.gpg] http://deb.xanmod.org noble main" \
            | sudo tee /etc/apt/sources.list.d/xanmod-release.list

          echo
          echo "Repository:"
          cat /etc/apt/sources.list.d/xanmod-release.list

      - name: Update APT
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "APT UPDATE"
          echo "=========================================="

          sudo apt-get update

      - name: Check XanMod package
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CHECK XANMOD RT X64V2"
          echo "=========================================="

          apt-cache policy "${XANMOD_KERNEL}"

      - name: Install XanMod RT x64v2
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Install XanMod RT x64v2"
          echo "=========================================="

          sudo apt-get install -y \
            "${XANMOD_KERNEL}"

      - name: Show installed XanMod packages
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "INSTALLED XANMOD PACKAGES"
          echo "=========================================="

          dpkg -l | grep xanmod || true

          echo
          echo "Installed kernel packages:"
          dpkg -l | grep -E 'linux-(image|headers).*xanmod' || true

      - name: Detect XanMod RT headers
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DETECT XANMOD RT HEADERS"
          echo "=========================================="

          echo
          echo "Available headers:"
          ls -ld /usr/src/linux-headers-* 2>/dev/null || true

          echo
          echo "Searching XanMod RT headers..."

          KERNEL_HEADERS=""

          for dir in /usr/src/linux-headers-*-xanmod-rt*; do
            if [ -d "${dir}" ]; then
              KERNEL_HEADERS="${dir}"
              break
            fi
          done

          if [ -z "${KERNEL_HEADERS}" ]; then
            echo
            echo "ERROR: XanMod RT headers not found."
            echo
            echo "Installed XanMod packages:"
            dpkg -l | grep xanmod || true
            exit 1
          fi

          KERNEL_RELEASE="$(basename "${KERNEL_HEADERS}")"
          KERNEL_RELEASE="${KERNEL_RELEASE#linux-headers-}"

          echo
          echo "KERNEL_HEADERS:"
          echo "${KERNEL_HEADERS}"

          echo
          echo "KERNEL_RELEASE:"
          echo "${KERNEL_RELEASE}"

          echo "KERNEL_HEADERS=${KERNEL_HEADERS}" >> "${GITHUB_ENV}"
          echo "KERNEL_RELEASE=${KERNEL_RELEASE}" >> "${GITHUB_ENV}"

      - name: Verify XanMod headers
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFY XANMOD HEADERS"
          echo "=========================================="

          echo
          echo "Kernel release:"
          echo "${KERNEL_RELEASE}"

          echo
          echo "Headers:"
          echo "${KERNEL_HEADERS}"

          test -d "${KERNEL_HEADERS}"
          test -f "${KERNEL_HEADERS}/Makefile"

          if [ ! -f "${KERNEL_HEADERS}/Module.symvers" ]; then
            echo "WARNING: Module.symvers not found in headers tree."
          fi

          echo
          echo "Header tree:"
          ls -ld "${KERNEL_HEADERS}"

          echo
          echo "Makefile:"
          ls -lh "${KERNEL_HEADERS}/Makefile"

      - name: Download Diretta source index
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Download Diretta source index"
          echo "=========================================="

          wget \
            --https-only \
            --timeout=30 \
            --tries=3 \
            -O /tmp/diretta-index.html \
            "${DIRETTA_URL}/"

          test -s /tmp/diretta-index.html

          echo
          echo "Diretta directory:"
          cat /tmp/diretta-index.html

      - name: Download alsa_bridge source
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Download alsa_bridge source"
          echo "=========================================="

          rm -rf daphile-diretta-build
          mkdir -p daphile-diretta-build

          cd daphile-diretta-build

          wget \
            --https-only \
            --timeout=30 \
            --tries=3 \
            -O alsa_bridge.c \
            "${DIRETTA_URL}/alsa_bridge.c"

          wget \
            --https-only \
            --timeout=30 \
            --tries=3 \
            -O alsa_bridge.h \
            "${DIRETTA_URL}/alsa_bridge.h"

          wget \
            --https-only \
            --timeout=30 \
            --tries=3 \
            -O Makefile \
            "${DIRETTA_URL}/Makefile"

          echo
          echo "Downloaded source:"
          ls -lh

      - name: Show Diretta Makefile
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DIRETTA MAKEFILE"
          echo "=========================================="

          cat daphile-diretta-build/Makefile

      - name: Verify Diretta source
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFY DIRETTA SOURCE"
          echo "=========================================="

          test -s daphile-diretta-build/alsa_bridge.c
          test -s daphile-diretta-build/alsa_bridge.h
          test -s daphile-diretta-build/Makefile

          echo
          echo "Source files:"
          ls -lh daphile-diretta-build

      - name: Build alsa_bridge
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "BUILD alsa_bridge.ko"
          echo "=========================================="

          echo
          echo "Kernel:"
          echo "${KERNEL_RELEASE}"

          echo
          echo "Headers:"
          echo "${KERNEL_HEADERS}"

          echo
          echo "Compiler:"
          gcc --version | head -1

          echo
          echo "Building..."

          make \
            -C "${KERNEL_HEADERS}" \
            ARCH=x86_64 \
            CC=gcc \
            M="${GITHUB_WORKSPACE}/daphile-diretta-build" \
            modules

      - name: Verify module
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFY MODULE"
          echo "=========================================="

          KO="${GITHUB_WORKSPACE}/daphile-diretta-build/alsa_bridge.ko"

          if [ ! -f "${KO}" ]; then
            echo "ERROR: alsa_bridge.ko was not created."
            exit 1
          fi

          echo
          echo "Module:"
          ls -lh "${KO}"

          echo
          echo "File:"
          file "${KO}"

          echo
          echo "modinfo:"
          modinfo "${KO}"

          echo
          echo "vermagic:"
          modinfo -F vermagic "${KO}"

      - name: Verify vermagic
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFY VERMAGIC"
          echo "=========================================="

          KO="${GITHUB_WORKSPACE}/daphile-diretta-build/alsa_bridge.ko"

          VERMAGIC="$(modinfo -F vermagic "${KO}")"

          echo
          echo "Kernel release:"
          echo "${KERNEL_RELEASE}"

          echo
          echo "Module vermagic:"
          echo "${VERMAGIC}"

          case "${VERMAGIC}" in
            "${KERNEL_RELEASE}"*)
              echo
              echo "VERMAGIC MATCH."
              ;;
            *)
              echo
              echo "ERROR: vermagic mismatch."
              echo
              echo "Expected prefix:"
              echo "${KERNEL_RELEASE}"
              echo
              echo "Actual:"
              echo "${VERMAGIC}"
              exit 1
              ;;
          esac

      - name: Prepare release
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "PREPARE RELEASE"
          echo "=========================================="

          rm -rf release
          mkdir -p release

          cp \
            daphile-diretta-build/alsa_bridge.ko \
            release/alsa_bridge.ko

          cp \
            daphile-diretta-build/alsa_bridge.c \
            release/alsa_bridge.c

          cp \
            daphile-diretta-build/alsa_bridge.h \
            release/alsa_bridge.h

          cp \
            daphile-diretta-build/Makefile \
            release/Makefile

          printf '%s\n' \
            "${KERNEL_RELEASE}" \
            > release/kernel.release

          echo
          echo "Release files:"
          ls -lh release

      - name: Create build info
        shell: bash
        run: |
          set -euo pipefail

          VERMAGIC="$(modinfo -F vermagic release/alsa_bridge.ko)"
          COMPILER="$(gcc --version | head -1)"
          BUILD_DATE="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          printf '%s\n' \
            "Module: alsa_bridge" \
            "Kernel: XanMod RT x64v2" \
            "Kernel release: ${KERNEL_RELEASE}" \
            "Kernel headers: ${KERNEL_HEADERS}" \
            "Vermagic: ${VERMAGIC}" \
            "Diretta source: ${DIRETTA_URL}" \
            "Compiler: ${COMPILER}" \
            "Runner: ubuntu-24.04" \
            "Build date: ${BUILD_DATE}" \
            > release/build-info.txt

          echo "=========================================="
          echo "BUILD INFO"
          echo "=========================================="

          cat release/build-info.txt

      - name: Create SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "SHA256"
          echo "=========================================="

          cd release

          sha256sum \
            alsa_bridge.ko \
            alsa_bridge.c \
            alsa_bridge.h \
            Makefile \
            kernel.release \
            build-info.txt \
            > SHA256SUMS

          cat SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: alsa-bridge-xanmod-rt-x64v2
          path: release

      - name: Final verification
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "BUILD SUCCESS"
          echo "=========================================="

          echo
          echo "Kernel:"
          cat release/kernel.release

          echo
          echo "Module:"
          ls -lh release/alsa_bridge.ko

          echo
          echo "Vermagic:"
          modinfo -F vermagic release/alsa_bridge.ko

          echo
          echo "=========================================="
          echo "RELEASE FILES"
          echo "=========================================="

          ls -lh release

          echo
          echo "=========================================="
          echo "alsa_bridge.ko BUILD COMPLETED"
          echo "=========================================="
