name: Build Diretta ALSA Bridge - XanMod RT x64v2

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  XANMOD_KERNEL_RELEASE: "6.18.52-rt-x64v2-xanmod1"
  DIRETTA_SOURCE_BASE: "https://gabe.babe123.top/DirettaAlsaHost"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            lld \
            llvm \
            gcc \
            g++ \
            make \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            dwarves \
            xz-utils \
            wget \
            curl \
            kmod \
            ca-certificates \
            gnupg

      - name: Add XanMod APT repository
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "ADD XANMOD APT REPOSITORY"
          echo "=========================================="

          sudo install -d -m 0755 /etc/apt/keyrings

          echo
          echo "Downloading XanMod repository key:"

          wget -q \
            "https://gabe.babe123.top/archive.key" \
            -O /tmp/xanmod-archive.key

          test -s /tmp/xanmod-archive.key

          echo
          echo "Installing XanMod repository key:"

          gpg \
            --dearmor \
            --yes \
            -o /tmp/xanmod-archive-keyring.gpg \
            /tmp/xanmod-archive.key

          sudo install \
            -m 0644 \
            /tmp/xanmod-archive-keyring.gpg \
            /etc/apt/keyrings/xanmod-archive-keyring.gpg

          echo
          echo "Adding XanMod repository:"

          echo \
            "deb [signed-by=/etc/apt/keyrings/xanmod-archive-keyring.gpg] http://deb.xanmod.org noble main" \
            | sudo tee /etc/apt/sources.list.d/xanmod-release.list

          echo
          echo "Updating APT:"

          sudo apt-get update

          echo
          echo "XanMod repository configured successfully."

      - name: Install XanMod RT x64v2 kernel
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "INSTALL XANMOD RT X64V2"
          echo "=========================================="

          sudo apt-get install -y \
            linux-xanmod-rt-x64v2

          echo
          echo "Installed XanMod packages:"

          dpkg -l | grep -E \
            'linux-(headers|image|xanmod-rt-x64v2)' \
            || true

      - name: Detect XanMod RT headers
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DETECT XANMOD RT HEADERS"
          echo "=========================================="

          echo
          echo "Available headers:"

          ls -ld \
            /usr/src/linux-headers-* \
            2>/dev/null || true

          echo
          echo "Installed XanMod packages:"

          dpkg -l | grep -E \
            'linux-(headers|image|xanmod-rt-x64v2)' \
            || true

          echo
          echo "Searching for XanMod RT x64v2 headers..."

          HEADER_DIR=""

          for dir in /usr/src/linux-headers-*-rt-x64v2-xanmod*; do
            if [ -d "${dir}" ]; then
              HEADER_DIR="${dir}"
              break
            fi
          done

          if [ -z "${HEADER_DIR}" ]; then
            echo
            echo "ERROR: XanMod RT x64v2 headers not found."
            echo
            echo "Available /usr/src directories:"

            find /usr/src \
              -maxdepth 1 \
              -type d \
              -name 'linux-*' \
              -print \
              | sort

            exit 1
          fi

          echo
          echo "XanMod RT headers found:"
          echo "${HEADER_DIR}"

          echo
          echo "Header directory:"
          ls -ld "${HEADER_DIR}"

          echo
          echo "Header Makefile:"
          ls -lh \
            "${HEADER_DIR}/Makefile"

          echo
          echo "Kernel release from headers:"

          ACTUAL_RELEASE="$(
            make \
              -s \
              -C "${HEADER_DIR}" \
              kernelrelease
          )"

          echo "${ACTUAL_RELEASE}"

          echo
          echo "Expected base release:"
          echo "${XANMOD_KERNEL_RELEASE}"

          EXPECTED_BASE="${XANMOD_KERNEL_RELEASE%-xanmod1}"

          if [ "${ACTUAL_RELEASE}" != "${EXPECTED_BASE}" ]; then
            echo
            echo "ERROR: kernel release mismatch."
            echo "Expected base: ${EXPECTED_BASE}"
            echo "Actual:         ${ACTUAL_RELEASE}"
            exit 1
          fi

          echo
          echo "=========================================="
          echo "XANMOD RT HEADERS VERIFIED"
          echo "=========================================="

          echo
          echo "Kernel headers:"
          echo "${HEADER_DIR}"

          echo
          echo "Kernel release:"
          echo "${ACTUAL_RELEASE}"

          echo "KERNEL_DIR=${HEADER_DIR}" >> "${GITHUB_ENV}"

      - name: Verify installed XanMod modules
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFY XANMOD INSTALLED MODULES"
          echo "=========================================="

          echo
          echo "Kernel release:"
          echo "${XANMOD_KERNEL_RELEASE}"

          echo
          echo "Installed kernel image:"

          dpkg-query \
            -W \
            -f='${Status}\n' \
            "linux-image-${XANMOD_KERNEL_RELEASE}" \
            2>/dev/null \
            | grep -q "install ok installed"

          echo "linux-image-${XANMOD_KERNEL_RELEASE}: installed"

          echo
          echo "Installed kernel headers:"

          dpkg-query \
            -W \
            -f='${Status}\n' \
            "linux-headers-${XANMOD_KERNEL_RELEASE}" \
            2>/dev/null \
            | grep -q "install ok installed"

          echo "linux-headers-${XANMOD_KERNEL_RELEASE}: installed"

          echo
          echo "Installed XanMod RT package:"

          dpkg-query \
            -W \
            -f='${Status}\n' \
            "linux-xanmod-rt-x64v2" \
            2>/dev/null \
            | grep -q "install ok installed"

          echo "linux-xanmod-rt-x64v2: installed"

          echo
          echo "Installed packages:"

          dpkg -l | grep \
            -E \
            'linux-(headers|image|xanmod-rt-x64v2)' \
            || true

          echo
          echo "XanMod package verification successful."

      - name: Download Diretta ALSA Bridge source
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DOWNLOAD DIRETTA ALSA BRIDGE SOURCE"
          echo "=========================================="

          echo
          echo "Source base:"
          echo "${DIRETTA_SOURCE_BASE}"

          mkdir -p daphile-diretta-build

          cd daphile-diretta-build

          echo
          echo "Downloading required source files..."

          echo
          echo "Downloading:"
          echo "alsa_bridge.c"

          wget -q \
            "${DIRETTA_SOURCE_BASE}/alsa_bridge.c" \
            -O alsa_bridge.c

          echo
          echo "Downloading:"
          echo "alsa_bridge.h"

          wget -q \
            "${DIRETTA_SOURCE_BASE}/alsa_bridge.h" \
            -O alsa_bridge.h

          echo
          echo "Downloading:"
          echo "Makefile"

          wget -q \
            "${DIRETTA_SOURCE_BASE}/Makefile" \
            -O Makefile

          echo
          echo "Downloaded files:"

          ls -lh

          test -s alsa_bridge.c
          test -s alsa_bridge.h
          test -s Makefile

          echo
          echo "Diretta source download successful."

      - name: Prepare writable kernel build directory
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "PREPARE KERNEL HEADERS"
          echo "=========================================="

          echo
          echo "Read-only kernel headers:"
          echo "${KERNEL_DIR}"

          BUILD_DIR="${GITHUB_WORKSPACE}/kernel-build"

          echo
          echo "Writable build directory:"
          echo "${BUILD_DIR}"

          rm -rf "${BUILD_DIR}"
          mkdir -p "${BUILD_DIR}"

          echo
          echo "Preparing external module build output..."

          make \
            -C "${KERNEL_DIR}" \
            O="${BUILD_DIR}" \
            ARCH=x86_64 \
            olddefconfig

          echo
          echo "Kernel build output prepared."

          echo "KERNEL_BUILD_DIR=${BUILD_DIR}" >> "${GITHUB_ENV}"

      - name: Build ALSA Bridge
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "BUILD ALSA_BRIDGE"
          echo "=========================================="

          echo
          echo "Kernel headers:"
          echo "${KERNEL_DIR}"

          echo
          echo "Kernel build tree:"
          echo "${KERNEL_BUILD_DIR}"

          echo
          echo "Kernel release:"

          make \
            -s \
            -C "${KERNEL_DIR}" \
            O="${KERNEL_BUILD_DIR}" \
            kernelrelease

          echo
          echo "Module source:"
          echo "${GITHUB_WORKSPACE}/daphile-diretta-build"

          echo
          echo "=== Makefile ==="

          cat \
            "${GITHUB_WORKSPACE}/daphile-diretta-build/Makefile"

          echo
          echo "=== Compiler ==="

          clang --version
          ld.lld --version | head -1

          echo
          echo "=== BUILD ==="

          make \
            -C "${KERNEL_DIR}" \
            O="${KERNEL_BUILD_DIR}" \
            ARCH=x86_64 \
            LLVM=1 \
            M="${GITHUB_WORKSPACE}/daphile-diretta-build" \
            modules

      - name: Verify module
        shell: bash
        run: |
          set -euo pipefail

          KO="${GITHUB_WORKSPACE}/daphile-diretta-build/alsa_bridge.ko"

          echo "=========================================="
          echo "VERIFY ALSA_BRIDGE MODULE"
          echo "=========================================="

          echo
          echo "Module:"
          echo "${KO}"

          if [ ! -f "${KO}" ]; then
            echo
            echo "ERROR: alsa_bridge.ko was not created."
            exit 1
          fi

          echo
          echo "=== File ==="

          ls -lh "${KO}"
          file "${KO}"

          echo
          echo "=== modinfo ==="

          modinfo "${KO}"

          echo
          echo "=== vermagic ==="

          modinfo -F vermagic "${KO}"

          echo
          echo "=== module name ==="

          modinfo -F name "${KO}"

          if [ "$(modinfo -F name "${KO}")" != "alsa_bridge" ]; then
            echo
            echo "ERROR: unexpected module name."
            exit 1
          fi

          echo
          echo "ALSA Bridge module verified."

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "PREPARE RELEASE FILES"
          echo "=========================================="

          rm -rf release
          mkdir -p release

          cp \
            daphile-diretta-build/alsa_bridge.ko \
            release/alsa_bridge.ko

          cp \
            daphile-diretta-build/alsa_bridge.c \
            release/alsa_bridge.c

          cp \
            daphile-diretta-build/alsa_bridge.h \
            release/alsa_bridge.h

          cp \
            daphile-diretta-build/Makefile \
            release/Makefile

          make \
            -s \
            -C "${KERNEL_DIR}" \
            O="${KERNEL_BUILD_DIR}" \
            kernelrelease \
            > release/kernel.release

          echo
          echo "Release files:"

          ls -lh release

      - name: Create build info
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CREATE BUILD INFO"
          echo "=========================================="

          KERNEL_RELEASE_ACTUAL="$(
            cat release/kernel.release
          )"

          COMPILER_VERSION="$(
            clang --version | head -1
          )"

          BUILD_DATE="$(
            date -u '+%Y-%m-%d %H:%M:%S UTC'
          )"

          printf '%s\n' \
            "Linux kernel: ${XANMOD_KERNEL_RELEASE}" \
            "Kernel release from headers: ${KERNEL_RELEASE_ACTUAL}" \
            "Module: alsa_bridge" \
            "Compiler: ${COMPILER_VERSION}" \
            "Build mode: LLVM=1" \
            "Architecture: x86_64" \
            "DIRETTA source: ${DIRETTA_SOURCE_BASE}" \
            "Build date: ${BUILD_DATE}" \
            > release/build-info.txt

          echo
          echo "=== build-info.txt ==="

          cat release/build-info.txt

      - name: Create checksum
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CREATE SHA256"
          echo "=========================================="

          cd release

          sha256sum \
            alsa_bridge.ko \
            alsa_bridge.c \
            alsa_bridge.h \
            Makefile \
            kernel.release \
            build-info.txt \
            > SHA256SUMS

          echo
          echo "=== SHA256SUMS ==="

          cat SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: alsa-bridge-${{ env.XANMOD_KERNEL_RELEASE }}
          path: release

      - name: Show final files
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "BUILD SUCCESS"
          echo "=========================================="

          echo
          echo "=== Release files ==="

          ls -lh release

          echo
          echo "=== Kernel release ==="

          cat release/kernel.release

          echo
          echo "=== Module info ==="

          modinfo release/alsa_bridge.ko

          echo
          echo "=== Module vermagic ==="

          modinfo -F vermagic release/alsa_bridge.ko

          echo
          echo "=========================================="
          echo "ALSA_BRIDGE BUILD COMPLETED"
          echo "=========================================="
