name: Build Diretta ALSA Bridge for XanMod RT x64v2

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  XANMOD_KERNEL_RELEASE: "6.18.52-rt-x64v2"
  XANMOD_PACKAGE: "linux-xanmod-rt-x64v2"
  DIRETTA_SOURCE_BASE: "https://gabe.babe123.top/DirettaAlsaHost"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "INSTALL BUILD DEPENDENCIES"
          echo "=========================================="

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            make \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            dwarves \
            xz-utils \
            wget \
            curl \
            kmod \
            gnupg \
            ca-certificates

      - name: Add XanMod APT repository
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "ADD XANMOD APT REPOSITORY"
          echo "=========================================="

          sudo mkdir -p /etc/apt/keyrings

          echo
          echo "Downloading XanMod repository key..."

          wget -q \
            -O /tmp/xanmod-archive.key \
            "https://gabe.babe123.top/archive.key"

          test -s /tmp/xanmod-archive.key

          echo
          echo "Installing XanMod repository key..."

          sudo gpg \
            --dearmor \
            --yes \
            -o /etc/apt/keyrings/xanmod-archive-keyring.gpg \
            /tmp/xanmod-archive.key

          test -s /etc/apt/keyrings/xanmod-archive-keyring.gpg

          echo
          echo "Adding XanMod repository..."

          echo \
            "deb [signed-by=/etc/apt/keyrings/xanmod-archive-keyring.gpg] http://deb.xanmod.org noble main" \
            | sudo tee /etc/apt/sources.list.d/xanmod-release.list

          echo
          echo "Repository configuration:"
          cat /etc/apt/sources.list.d/xanmod-release.list

          echo
          echo "Updating package lists..."

          sudo apt-get update

      - name: Install XanMod RT x64v2
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "INSTALL XANMOD RT X64V2"
          echo "=========================================="

          echo
          echo "Package:"
          echo "${XANMOD_PACKAGE}"

          sudo apt-get install -y \
            "${XANMOD_PACKAGE}"

          echo
          echo "Installed XanMod packages:"
          dpkg -l | grep -E \
            'linux-(headers|image|xanmod-rt-x64v2)' \
            || true

      - name: Detect XanMod RT headers
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DETECT XANMOD RT HEADERS"
          echo "=========================================="

          echo
          echo "Available headers:"

          ls -ld \
            /usr/src/linux-headers-* \
            2>/dev/null || true

          echo
          echo "Installed XanMod packages:"

          dpkg -l | grep -E \
            'linux-(headers|image|xanmod-rt-x64v2)' \
            || true

          echo
          echo "Searching for XanMod RT x64v2 headers..."

          HEADER_DIR=""

          for dir in /usr/src/linux-headers-*-rt-x64v2-xanmod*; do
            if [ -d "${dir}" ]; then
              HEADER_DIR="${dir}"
              break
            fi
          done

          if [ -z "${HEADER_DIR}" ]; then
            echo
            echo "ERROR: XanMod RT x64v2 headers not found."
            echo
            echo "Available /usr/src directories:"
            find /usr/src \
              -maxdepth 1 \
              -type d \
              -name 'linux-*' \
              -print \
              | sort
            exit 1
          fi

          echo
          echo "XanMod RT headers found:"
          echo "${HEADER_DIR}"

          echo
          echo "Header directory:"
          ls -ld "${HEADER_DIR}"

          echo
          echo "Header Makefile:"
          ls -lh \
            "${HEADER_DIR}/Makefile"

          echo
          echo "Kernel release from headers:"

          ACTUAL_RELEASE="$(
            make \
              -s \
              -C "${HEADER_DIR}" \
              kernelrelease
          )"

          echo "${ACTUAL_RELEASE}"

          echo
          echo "Expected:"
          echo "${XANMOD_KERNEL_RELEASE}"

          if [ "${ACTUAL_RELEASE}" != "${XANMOD_KERNEL_RELEASE}" ]; then
            echo
            echo "ERROR: kernel release mismatch."
            echo "Expected: ${XANMOD_KERNEL_RELEASE}"
            echo "Actual:   ${ACTUAL_RELEASE}"
            exit 1
          fi

          echo
          echo "=========================================="
          echo "XANMOD RT HEADERS VERIFIED"
          echo "=========================================="

          echo
          echo "Kernel headers:"
          echo "${HEADER_DIR}"

          echo
          echo "Kernel release:"
          echo "${ACTUAL_RELEASE}"

          echo "KERNEL_DIR=${HEADER_DIR}" >> "${GITHUB_ENV}"

      - name: Verify installed XanMod kernel
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFY XANMOD RT KERNEL"
          echo "=========================================="

          echo
          echo "Installed images:"

          dpkg -l | grep \
            'linux-image-6.18.52-rt-x64v2-xanmod1' \
            || true

          echo
          echo "Installed headers:"

          dpkg -l | grep \
            'linux-headers-6.18.52-rt-x64v2-xanmod1' \
            || true

          echo
          echo "XanMod package:"

          dpkg -l | grep \
            'linux-xanmod-rt-x64v2' \
            || true

          echo
          echo "Kernel modules directory:"

          if [ -d "/lib/modules/${XANMOD_KERNEL_RELEASE}" ]; then
            ls -ld \
              "/lib/modules/${XANMOD_KERNEL_RELEASE}"
          else
            echo
            echo "WARNING:"
            echo "/lib/modules/${XANMOD_KERNEL_RELEASE} does not exist."

            echo
            echo "Available /lib/modules:"
            ls -ld \
              /lib/modules/* \
              2>/dev/null || true
          fi

          echo
          echo "Installed XanMod kernel files:"

          find /lib/modules \
            -maxdepth 2 \
            -type f \
            \( \
              -name 'vmlinuz*' \
              -o -name 'modules.dep' \
              -o -name 'modules.order' \
            \) \
            2>/dev/null \
            | sort \
            | grep '6.18.52' \
            || true

          echo
          echo "XanMod kernel package verification completed."

      - name: Download Diretta ALSA Bridge source
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DOWNLOAD DIRETTA ALSA BRIDGE SOURCE"
          echo "=========================================="

          echo
          echo "Source base:"
          echo "${DIRETTA_SOURCE_BASE}"

          mkdir -p daphile-diretta-build

          echo
          echo "Downloading required source files..."

          echo
          echo "Downloading:"
          echo "alsa_bridge.c"

          wget -q \
            --show-progress \
            -O daphile-diretta-build/alsa_bridge.c \
            "${DIRETTA_SOURCE_BASE}/alsa_bridge.c"

          echo
          echo "Downloading:"
          echo "alsa_bridge.h"

          wget -q \
            --show-progress \
            -O daphile-diretta-build/alsa_bridge.h \
            "${DIRETTA_SOURCE_BASE}/alsa_bridge.h"

          echo
          echo "Downloading:"
          echo "Makefile"

          wget -q \
            --show-progress \
            -O daphile-diretta-build/Makefile \
            "${DIRETTA_SOURCE_BASE}/Makefile"

          echo
          echo "Source files downloaded."

          echo
          echo "=== Source files ==="

          ls -lh \
            daphile-diretta-build/alsa_bridge.c \
            daphile-diretta-build/alsa_bridge.h \
            daphile-diretta-build/Makefile

          echo
          echo "=== Source directory ==="

          find \
            daphile-diretta-build \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

      - name: Verify Diretta source
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFY DIRETTA SOURCE"
          echo "=========================================="

          for file in \
            daphile-diretta-build/alsa_bridge.c \
            daphile-diretta-build/alsa_bridge.h \
            daphile-diretta-build/Makefile
          do
            if [ ! -s "${file}" ]; then
              echo
              echo "ERROR: source file missing or empty:"
              echo "${file}"
              exit 1
            fi
          done

          echo
          echo "=== Files ==="

          ls -lh \
            daphile-diretta-build/alsa_bridge.c \
            daphile-diretta-build/alsa_bridge.h \
            daphile-diretta-build/Makefile

          echo
          echo "=== Makefile ==="

          cat \
            daphile-diretta-build/Makefile

      - name: Check kernel release
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CHECK XANMOD KERNEL RELEASE"
          echo "=========================================="

          echo
          echo "Kernel headers:"
          echo "${KERNEL_DIR}"

          ACTUAL_RELEASE="$(
            make \
              -s \
              -C "${KERNEL_DIR}" \
              kernelrelease
          )"

          echo
          echo "Actual:"
          echo "${ACTUAL_RELEASE}"

          echo
          echo "Expected:"
          echo "${XANMOD_KERNEL_RELEASE}"

          if [ "${ACTUAL_RELEASE}" != "${XANMOD_KERNEL_RELEASE}" ]; then
            echo
            echo "ERROR: unexpected kernel release."
            exit 1
          fi

          echo
          echo "Kernel release verified."

      - name: Prepare kernel headers
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "PREPARE KERNEL HEADERS"
          echo "=========================================="

          make \
            -C "${KERNEL_DIR}" \
            ARCH=x86_64 \
            modules_prepare

          echo
          echo "Kernel headers prepared."

      - name: Build alsa_bridge
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "BUILD DIRETTA ALSA BRIDGE"
          echo "=========================================="

          echo
          echo "Kernel:"
          echo "${KERNEL_DIR}"

          echo
          echo "Kernel release:"
          make \
            -s \
            -C "${KERNEL_DIR}" \
            kernelrelease

          echo
          echo "Module source:"
          find \
            daphile-diretta-build \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

          echo
          echo "=== Build ==="

          make \
            -C "${KERNEL_DIR}" \
            ARCH=x86_64 \
            CC=gcc \
            M="${GITHUB_WORKSPACE}/daphile-diretta-build" \
            modules

      - name: Verify module
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFY ALSA BRIDGE MODULE"
          echo "=========================================="

          KO="${GITHUB_WORKSPACE}/daphile-diretta-build/alsa_bridge.ko"

          echo
          echo "Module:"
          echo "${KO}"

          if [ ! -f "${KO}" ]; then
            echo
            echo "ERROR: alsa_bridge.ko was not created."
            exit 1
          fi

          echo
          echo "=== Module file ==="

          ls -lh "${KO}"

          echo
          echo "=== File ==="

          file "${KO}"

          echo
          echo "=== Modinfo ==="

          modinfo "${KO}"

          echo
          echo "=== Vermagic ==="

          VERMAGIC="$(
            modinfo \
              -F vermagic \
              "${KO}"
          )"

          echo "${VERMAGIC}"

          echo
          echo "Expected kernel release:"
          echo "${XANMOD_KERNEL_RELEASE}"

          case "${VERMAGIC}" in
            "${XANMOD_KERNEL_RELEASE}"\ *)
              echo
              echo "Vermagic kernel release is correct."
              ;;
            *)
              echo
              echo "ERROR: vermagic does not match XanMod kernel."
              echo "Expected prefix:"
              echo "${XANMOD_KERNEL_RELEASE}"
              echo "Actual:"
              echo "${VERMAGIC}"
              exit 1
              ;;
          esac

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "PREPARE RELEASE FILES"
          echo "=========================================="

          rm -rf release

          mkdir -p release

          cp \
            daphile-diretta-build/alsa_bridge.ko \
            release/alsa_bridge.ko

          cp \
            daphile-diretta-build/alsa_bridge.c \
            release/alsa_bridge.c

          cp \
            daphile-diretta-build/alsa_bridge.h \
            release/alsa_bridge.h

          cp \
            daphile-diretta-build/Makefile \
            release/Makefile

          make \
            -s \
            -C "${KERNEL_DIR}" \
            kernelrelease \
            > release/kernel.release

          echo
          echo "Release files:"

          ls -lh release

      - name: Create build info
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CREATE BUILD INFO"
          echo "=========================================="

          KERNEL_RELEASE_ACTUAL="$(
            cat release/kernel.release
          )"

          COMPILER_VERSION="$(
            gcc --version | head -1
          )"

          BUILD_DATE="$(
            date -u '+%Y-%m-%d %H:%M:%S UTC'
          )"

          printf '%s\n' \
            "Kernel release: ${KERNEL_RELEASE_ACTUAL}" \
            "XanMod package: ${XANMOD_PACKAGE}" \
            "Module: alsa_bridge" \
            "Architecture: x86_64" \
            "Compiler: ${COMPILER_VERSION}" \
            "Build date: ${BUILD_DATE}" \
            "Diretta source: ${DIRETTA_SOURCE_BASE}" \
            > release/build-info.txt

          echo
          echo "=== build-info.txt ==="

          cat \
            release/build-info.txt

      - name: Create checksum
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CREATE SHA256 CHECKSUMS"
          echo "=========================================="

          cd release

          sha256sum \
            alsa_bridge.ko \
            kernel.release \
            build-info.txt \
            > SHA256SUMS

          echo
          echo "=== SHA256SUMS ==="

          cat SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: alsa-bridge-${{ env.XANMOD_KERNEL_RELEASE }}
          path: release

      - name: Show final files
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "BUILD SUCCESS"
          echo "=========================================="

          echo
          echo "=== Release files ==="

          ls -lh release

          echo
          echo "=== Kernel release ==="

          cat \
            release/kernel.release

          echo
          echo "=== Module info ==="

          modinfo \
            release/alsa_bridge.ko

          echo
          echo "=== Vermagic ==="

          modinfo \
            -F vermagic \
            release/alsa_bridge.ko

          echo
          echo "=========================================="
          echo "DIRETTA ALSA BRIDGE BUILD COMPLETE"
          echo "=========================================="
