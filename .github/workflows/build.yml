name: Build Diretta ALSA Bridge - XanMod RT x64v2

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  XANMOD_KERNEL_VERSION: "6.18.52"
  XANMOD_KERNEL_RELEASE: "6.18.52-rt-x64v2"
  XANMOD_PACKAGE: "linux-xanmod-rt-x64v2"

  DIRETTA_SOURCE_BASE: "https://gabe.babe123.top/DirettaAlsaHost"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # Install dependencies
      # ============================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "INSTALL BUILD DEPENDENCIES"
          echo "=========================================="

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            make \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            dwarves \
            xz-utils \
            wget \
            curl \
            kmod \
            ca-certificates \
            gnupg \
            file


      # ============================================================
      # Add XanMod repository
      # ============================================================

      - name: Add XanMod APT repository
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "ADD XANMOD APT REPOSITORY"
          echo "=========================================="

          sudo install -d -m 0755 /etc/apt/keyrings

          echo
          echo "Downloading XanMod repository key..."

          wget -q \
            "https://gabe.babe123.top/archive.key" \
            -O /tmp/xanmod-archive.key

          test -s /tmp/xanmod-archive.key

          echo
          echo "Importing XanMod repository key..."

          gpg \
            --dearmor \
            --yes \
            -o /tmp/xanmod-archive-keyring.gpg \
            /tmp/xanmod-archive.key

          sudo install \
            -m 0644 \
            /tmp/xanmod-archive-keyring.gpg \
            /etc/apt/keyrings/xanmod-archive-keyring.gpg

          echo
          echo "Adding XanMod repository..."

          echo \
            "deb [signed-by=/etc/apt/keyrings/xanmod-archive-keyring.gpg] http://deb.xanmod.org noble main" \
            | sudo tee \
              /etc/apt/sources.list.d/xanmod-release.list

          echo
          echo "Updating APT..."

          sudo apt-get update


      # ============================================================
      # Install XanMod RT x64v2
      # ============================================================

      - name: Install XanMod RT x64v2
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "INSTALL XANMOD RT X64V2"
          echo "=========================================="

          sudo apt-get install -y \
            "${XANMOD_PACKAGE}"

          echo
          echo "Installed XanMod packages:"

          dpkg -l | grep -E \
            'linux-(headers|image|xanmod-rt-x64v2)' \
            || true


      # ============================================================
      # Detect XanMod RT headers
      # ============================================================

      - name: Detect XanMod RT headers
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DETECT XANMOD RT HEADERS"
          echo "=========================================="

          echo
          echo "Available headers:"

          ls -ld \
            /usr/src/linux-headers-* \
            2>/dev/null || true

          echo
          echo "Installed XanMod packages:"

          dpkg -l | grep -E \
            'linux-(headers|image|xanmod-rt-x64v2)' \
            || true

          echo
          echo "Searching for XanMod RT x64v2 headers..."

          HEADER_DIR=""

          for dir in /usr/src/linux-headers-*-rt-x64v2-xanmod*; do
            if [ -d "${dir}" ]; then
              HEADER_DIR="${dir}"
              break
            fi
          done

          if [ -z "${HEADER_DIR}" ]; then
            echo
            echo "ERROR: XanMod RT x64v2 headers not found."
            echo
            echo "Available /usr/src directories:"

            find /usr/src \
              -maxdepth 1 \
              -type d \
              -name 'linux-*' \
              -print \
              | sort

            exit 1
          fi

          echo
          echo "XanMod RT headers found:"
          echo "${HEADER_DIR}"

          echo
          echo "Header directory:"
          ls -ld "${HEADER_DIR}"

          echo
          echo "Header Makefile:"
          ls -lh \
            "${HEADER_DIR}/Makefile"

          echo
          echo "Kernel release from headers:"

          ACTUAL_RELEASE="$(
            make \
              -s \
              -C "${HEADER_DIR}" \
              kernelrelease
          )"

          echo "${ACTUAL_RELEASE}"

          echo
          echo "Expected kernel release:"
          echo "${XANMOD_KERNEL_RELEASE}"

          # XanMod Debian package suffix "-xanmod1"
          # is NOT part of make kernelrelease.
          #
          # Expected:
          #   6.18.52-rt-x64v2
          #
          # Package name/version:
          #   6.18.52-rt-x64v2-xanmod1

          if [ "${ACTUAL_RELEASE}" != "${XANMOD_KERNEL_RELEASE}" ]; then
            echo
            echo "ERROR: kernel release mismatch."
            echo "Expected: ${XANMOD_KERNEL_RELEASE}"
            echo "Actual:   ${ACTUAL_RELEASE}"
            exit 1
          fi

          echo
          echo "=========================================="
          echo "XANMOD RT HEADERS VERIFIED"
          echo "=========================================="

          echo
          echo "System headers:"
          echo "${HEADER_DIR}"

          echo
          echo "Kernel release:"
          echo "${ACTUAL_RELEASE}"

          echo "XANMOD_SYSTEM_HEADERS=${HEADER_DIR}" >> "${GITHUB_ENV}"


      # ============================================================
      # Create writable kernel build tree
      #
      # IMPORTANT:
      # Do NOT run make prepare/modules_prepare against
      # /usr/src/linux-headers-* directly.
      #
      # The Debian/XanMod headers directory is root-owned.
      # Also, using O= against the packaged headers causes
      # the "source tree is not clean" check.
      #
      # We therefore copy the complete prepared headers tree
      # into the GitHub Actions workspace.
      # ============================================================

      - name: Create writable kernel build tree
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CREATE WRITABLE KERNEL BUILD TREE"
          echo "=========================================="

          echo
          echo "Source headers:"
          echo "${XANMOD_SYSTEM_HEADERS}"

          KERNEL_BUILD_DIR="${GITHUB_WORKSPACE}/kernel-build"

          rm -rf "${KERNEL_BUILD_DIR}"

          mkdir -p "${KERNEL_BUILD_DIR}"

          echo
          echo "Copying XanMod headers..."

          cp -aL \
            "${XANMOD_SYSTEM_HEADERS}/." \
            "${KERNEL_BUILD_DIR}/"

          echo
          echo "Making copied tree writable..."

          chmod -R u+rwX \
            "${KERNEL_BUILD_DIR}"

          echo
          echo "Writable kernel build tree:"
          echo "${KERNEL_BUILD_DIR}"

          echo
          echo "Kernel Makefile:"
          ls -lh \
            "${KERNEL_BUILD_DIR}/Makefile"

          echo
          echo "Kernel release:"

          make \
            -s \
            -C "${KERNEL_BUILD_DIR}" \
            kernelrelease

          echo
          echo "=========================================="
          echo "WRITABLE KERNEL BUILD TREE READY"
          echo "=========================================="

          echo "XANMOD_KERNEL_DIR=${KERNEL_BUILD_DIR}" >> "${GITHUB_ENV}"


      # ============================================================
      # Verify copied kernel tree
      # ============================================================

      - name: Verify kernel build tree
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFY KERNEL BUILD TREE"
          echo "=========================================="

          echo
          echo "Kernel directory:"
          echo "${XANMOD_KERNEL_DIR}"

          test -d \
            "${XANMOD_KERNEL_DIR}"

          test -f \
            "${XANMOD_KERNEL_DIR}/Makefile"

          echo
          echo "Kernel release:"

          ACTUAL_RELEASE="$(
            make \
              -s \
              -C "${XANMOD_KERNEL_DIR}" \
              kernelrelease
          )"

          echo "${ACTUAL_RELEASE}"

          echo
          echo "Expected:"
          echo "${XANMOD_KERNEL_RELEASE}"

          if [ "${ACTUAL_RELEASE}" != "${XANMOD_KERNEL_RELEASE}" ]; then
            echo
            echo "ERROR: copied kernel tree release mismatch."
            exit 1
          fi

          echo
          echo "Kernel build tree verified."


      # ============================================================
      # Download Diretta ALSA Bridge source files
      #
      # IMPORTANT:
      # Do NOT download the directory itself.
      # Download only the files needed to compile the module.
      # ============================================================

      - name: Download Diretta ALSA Bridge source
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DOWNLOAD DIRETTA ALSA BRIDGE SOURCE"
          echo "=========================================="

          echo
          echo "Source base:"
          echo "${DIRETTA_SOURCE_BASE}"

          rm -rf daphile-diretta-build

          mkdir -p \
            daphile-diretta-build

          cd \
            daphile-diretta-build

          echo
          echo "Downloading required source files..."

          for file in \
            alsa_bridge.c \
            alsa_bridge.h \
            Makefile
          do
            echo
            echo "Downloading:"
            echo "${file}"

            wget -q \
              "${DIRETTA_SOURCE_BASE}/${file}" \
              -O "${file}"

            test -s "${file}"

            echo "OK: ${file}"
          done

          echo
          echo "=========================================="
          echo "DIRETTA SOURCE FILES"
          echo "=========================================="

          ls -lh


      # ============================================================
      # Verify Diretta source
      # ============================================================

      - name: Verify Diretta source
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFY DIRETTA SOURCE"
          echo "=========================================="

          for file in \
            daphile-diretta-build/alsa_bridge.c \
            daphile-diretta-build/alsa_bridge.h \
            daphile-diretta-build/Makefile
          do
            echo
            echo "Checking:"
            echo "${file}"

            test -s "${file}"

            ls -lh "${file}"
          done

          echo
          echo "=== Makefile ==="
          cat daphile-diretta-build/Makefile


      # ============================================================
      # Build alsa_bridge
      #
      # IMPORTANT:
      # No "make prepare".
      # No "make modules_prepare".
      #
      # XanMod Debian headers are already prepared for external
      # module builds.
      # ============================================================

      - name: Build alsa_bridge
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "BUILD ALSA_BRIDGE"
          echo "=========================================="

          echo
          echo "Kernel build tree:"
          echo "${XANMOD_KERNEL_DIR}"

          echo
          echo "Kernel release:"

          make \
            -s \
            -C "${XANMOD_KERNEL_DIR}" \
            kernelrelease

          echo
          echo "Module source:"
          echo "${GITHUB_WORKSPACE}/daphile-diretta-build"

          echo
          echo "=== Makefile ==="
          cat \
            daphile-diretta-build/Makefile

          echo
          echo "=== BUILD ==="

          make \
            -C "${XANMOD_KERNEL_DIR}" \
            ARCH=x86_64 \
            M="${GITHUB_WORKSPACE}/daphile-diretta-build" \
            modules


      # ============================================================
      # Verify module
      # ============================================================

      - name: Verify module
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFY ALSA_BRIDGE MODULE"
          echo "=========================================="

          KO="${GITHUB_WORKSPACE}/daphile-diretta-build/alsa_bridge.ko"

          if [ ! -f "${KO}" ]; then
            echo
            echo "ERROR: alsa_bridge.ko was not created."
            echo
            echo "Directory contents:"
            find \
              daphile-diretta-build \
              -maxdepth 2 \
              -type f \
              -print \
              | sort

            exit 1
          fi

          echo
          echo "Module:"
          ls -lh "${KO}"

          echo
          echo "=== FILE ==="
          file "${KO}"

          echo
          echo "=== MODINFO ==="
          modinfo "${KO}"

          echo
          echo "=== VERMAGIC ==="
          modinfo -F vermagic "${KO}"


      # ============================================================
      # Prepare release files
      # ============================================================

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "PREPARE RELEASE FILES"
          echo "=========================================="

          rm -rf release

          mkdir -p release

          cp \
            daphile-diretta-build/alsa_bridge.ko \
            release/alsa_bridge.ko

          cp \
            daphile-diretta-build/alsa_bridge.c \
            release/alsa_bridge.c

          cp \
            daphile-diretta-build/alsa_bridge.h \
            release/alsa_bridge.h

          cp \
            daphile-diretta-build/Makefile \
            release/Makefile

          make \
            -s \
            -C "${XANMOD_KERNEL_DIR}" \
            kernelrelease \
            > release/kernel.release

          echo
          echo "Kernel release:"
          cat release/kernel.release

          echo
          echo "Release files:"
          ls -lh release


      # ============================================================
      # Create build info
      # ============================================================

      - name: Create build info
        shell: bash
        run: |
          set -euo pipefail

          KERNEL_RELEASE_ACTUAL="$(
            cat release/kernel.release
          )"

          COMPILER_VERSION="$(
            gcc --version \
              | head -1
          )"

          BUILD_DATE="$(
            date -u '+%Y-%m-%d %H:%M:%S UTC'
          )"

          printf '%s\n' \
            "Kernel package: ${XANMOD_PACKAGE}" \
            "Kernel version: ${XANMOD_KERNEL_VERSION}" \
            "Kernel release: ${KERNEL_RELEASE_ACTUAL}" \
            "Module: alsa_bridge" \
            "Architecture: x86_64" \
            "XanMod variant: RT x64v2" \
            "Compiler: ${COMPILER_VERSION}" \
            "Build date: ${BUILD_DATE}" \
            "Diretta source: ${DIRETTA_SOURCE_BASE}" \
            > release/build-info.txt

          echo
          echo "=========================================="
          echo "BUILD INFO"
          echo "=========================================="

          cat \
            release/build-info.txt


      # ============================================================
      # Create checksum
      # ============================================================

      - name: Create checksum
        shell: bash
        run: |
          set -euo pipefail

          cd release

          sha256sum \
            alsa_bridge.ko \
            kernel.release \
            build-info.txt \
            > SHA256SUMS

          echo
          echo "=========================================="
          echo "SHA256SUMS"
          echo "=========================================="

          cat SHA256SUMS


      # ============================================================
      # Upload artifact
      # ============================================================

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: alsa-bridge-xanmod-rt-x64v2
          path: release


      # ============================================================
      # Final result
      # ============================================================

      - name: Show final files
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "BUILD SUCCESS"
          echo "=========================================="

          echo
          echo "=== Kernel ==="

          make \
            -s \
            -C "${XANMOD_KERNEL_DIR}" \
            kernelrelease

          echo
          echo "=== Release files ==="

          ls -lh \
            release

          echo
          echo "=== Module info ==="

          modinfo \
            release/alsa_bridge.ko

          echo
          echo "=== Vermagic ==="

          modinfo \
            -F vermagic \
            release/alsa_bridge.ko
