name: Build Diretta ALSA Bridge for XanMod RT x64v2

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  XANMOD_KERNEL_RELEASE: "6.18.52-rt-x64v2-xanmod1"
  DIRETTA_SOURCE_BASE: "https://gabe.babe123.top/DirettaAlsaHost"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "INSTALL BUILD DEPENDENCIES"
          echo "=========================================="

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            dwarves \
            xz-utils \
            wget \
            curl \
            kmod \
            ca-certificates \
            gnupg

      - name: Add XanMod APT repository
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "ADD XANMOD APT REPOSITORY"
          echo "=========================================="

          sudo mkdir -p /etc/apt/keyrings

          echo
          echo "Downloading XanMod repository key..."

          wget -q \
            "https://gabe.babe123.top/archive.key" \
            -O /tmp/xanmod-archive.key

          if [ ! -s /tmp/xanmod-archive.key ]; then
            echo "ERROR: XanMod repository key is empty."
            exit 1
          fi

          echo
          echo "Checking GPG key..."

          gpg \
            --show-keys \
            /tmp/xanmod-archive.key

          echo
          echo "Converting GPG key..."

          gpg \
            --dearmor \
            --yes \
            -o /tmp/xanmod-archive-keyring.gpg \
            /tmp/xanmod-archive.key

          sudo install \
            -m 0644 \
            /tmp/xanmod-archive-keyring.gpg \
            /etc/apt/keyrings/xanmod-archive-keyring.gpg

          echo
          echo "Adding XanMod repository..."

          echo \
            "deb [signed-by=/etc/apt/keyrings/xanmod-archive-keyring.gpg] http://deb.xanmod.org noble main" \
            | sudo tee /etc/apt/sources.list.d/xanmod-release.list

          echo
          echo "Repository:"
          cat /etc/apt/sources.list.d/xanmod-release.list

      - name: Update APT
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "APT UPDATE"
          echo "=========================================="

          sudo apt-get update

      - name: Install XanMod RT x64v2
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "INSTALL XANMOD RT X64V2"
          echo "=========================================="

          sudo apt-get install -y \
            linux-xanmod-rt-x64v2

          echo
          echo "Installed XanMod packages:"

          dpkg -l | grep -E \
            'linux-(headers|image|xanmod-rt-x64v2)' \
            || true

      - name: Detect XanMod kernel and headers
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DETECT XANMOD RT KERNEL"
          echo "=========================================="

          echo
          echo "Expected kernel release:"
          echo "${XANMOD_KERNEL_RELEASE}"

          echo
          echo "Installed /lib/modules:"
          ls -ld \
            /lib/modules/* \
            2>/dev/null || true

          KERNEL_MODULE_DIR="/lib/modules/${XANMOD_KERNEL_RELEASE}"

          echo
          echo "Expected module directory:"
          echo "${KERNEL_MODULE_DIR}"

          if [ ! -d "${KERNEL_MODULE_DIR}" ]; then
            echo
            echo "ERROR: XanMod kernel module directory not found:"
            echo "${KERNEL_MODULE_DIR}"

            echo
            echo "Available module directories:"
            find /lib/modules \
              -maxdepth 1 \
              -mindepth 1 \
              -type d \
              -print \
              | sort

            exit 1
          fi

          echo
          echo "XanMod module directory found:"
          echo "${KERNEL_MODULE_DIR}"

          echo
          echo "Build symlink:"

          if [ ! -e "${KERNEL_MODULE_DIR}/build" ]; then
            echo
            echo "ERROR: kernel build symlink not found:"
            echo "${KERNEL_MODULE_DIR}/build"
            exit 1
          fi

          ls -ld \
            "${KERNEL_MODULE_DIR}/build"

          KERNEL_DIR="$(readlink -f "${KERNEL_MODULE_DIR}/build")"

          echo
          echo "Resolved kernel headers:"
          echo "${KERNEL_DIR}"

          if [ ! -d "${KERNEL_DIR}" ]; then
            echo
            echo "ERROR: resolved kernel headers directory does not exist."
            exit 1
          fi

          echo
          echo "Header Makefile:"
          ls -lh \
            "${KERNEL_DIR}/Makefile"

          echo
          echo "Header .config:"

          if [ -f "${KERNEL_DIR}/.config" ]; then
            ls -lh \
              "${KERNEL_DIR}/.config"
          else
            echo "WARNING: .config not found."
          fi

          echo
          echo "Header Module.symvers:"

          if [ -f "${KERNEL_DIR}/Module.symvers" ]; then
            ls -lh \
              "${KERNEL_DIR}/Module.symvers"
          else
            echo "WARNING: Module.symvers not found."
          fi

          echo
          echo "Kernel release reported by headers:"

          HEADER_RELEASE="$(
            make \
              -s \
              -C "${KERNEL_DIR}" \
              kernelrelease
          )"

          echo "${HEADER_RELEASE}"

          echo
          echo "IMPORTANT:"
          echo "The header kernelrelease does not have to equal"
          echo "the Debian/XanMod module directory name."

          echo
          echo "XanMod package release:"
          echo "${XANMOD_KERNEL_RELEASE}"

          echo
          echo "Header internal release:"
          echo "${HEADER_RELEASE}"

          echo
          echo "Kernel directory:"
          echo "${KERNEL_DIR}"

          echo "KERNEL_DIR=${KERNEL_DIR}" >> "${GITHUB_ENV}"
          echo "KERNEL_MODULE_DIR=${KERNEL_MODULE_DIR}" >> "${GITHUB_ENV}"
          echo "HEADER_RELEASE=${HEADER_RELEASE}" >> "${GITHUB_ENV}"

      - name: Verify XanMod installed modules
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFY XANMOD INSTALLED MODULES"
          echo "=========================================="

          echo
          echo "Searching installed XanMod modules..."

          MODULE_SAMPLE="$(
            find \
              "${KERNEL_MODULE_DIR}/kernel" \
              -type f \
              \( -name '*.ko' -o -name '*.ko.xz' -o -name '*.ko.zst' \) \
              2>/dev/null \
              | head -1
          )"

          if [ -z "${MODULE_SAMPLE}" ]; then
            echo
            echo "ERROR: No XanMod kernel modules found."
            exit 1
          fi

          echo
          echo "Sample XanMod module:"
          echo "${MODULE_SAMPLE}"

          echo
          echo "Sample module information:"

          case "${MODULE_SAMPLE}" in
            *.ko)
              modinfo "${MODULE_SAMPLE}" || true
              ;;
            *.ko.xz)
              echo "Compressed module: ${MODULE_SAMPLE}"
              ;;
            *.ko.zst)
              echo "Compressed module: ${MODULE_SAMPLE}"
              ;;
          esac

          echo
          echo "Installed XanMod module tree exists."

      - name: Download Diretta ALSA Bridge source
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DOWNLOAD DIRETTA ALSA BRIDGE SOURCE"
          echo "=========================================="

          echo
          echo "Source base:"
          echo "${DIRETTA_SOURCE_BASE}"

          rm -rf daphile-diretta-build

          mkdir -p daphile-diretta-build

          cd daphile-diretta-build

          echo
          echo "Downloading required source files..."

          wget -q \
            --show-progress \
            "${DIRETTA_SOURCE_BASE}/alsa_bridge.c" \
            -O alsa_bridge.c

          wget -q \
            --show-progress \
            "${DIRETTA_SOURCE_BASE}/alsa_bridge.h" \
            -O alsa_bridge.h

          wget -q \
            --show-progress \
            "${DIRETTA_SOURCE_BASE}/Makefile" \
            -O Makefile

          echo
          echo "Downloaded files:"

          ls -lh \
            alsa_bridge.c \
            alsa_bridge.h \
            Makefile

      - name: Verify Diretta source
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFY DIRETTA SOURCE"
          echo "=========================================="

          for file in \
            alsa_bridge.c \
            alsa_bridge.h \
            Makefile
          do
            if [ ! -s "daphile-diretta-build/${file}" ]; then
              echo
              echo "ERROR: source file missing or empty:"
              echo "${file}"
              exit 1
            fi
          done

          echo
          echo "Source files verified."

          echo
          echo "Source directory:"
          find daphile-diretta-build \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          echo
          echo "=========================================="
          echo "DIRETTA MAKEFILE"
          echo "=========================================="

          cat daphile-diretta-build/Makefile

      - name: Check kernel build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CHECK KERNEL BUILD ENVIRONMENT"
          echo "=========================================="

          echo
          echo "Kernel module directory:"
          echo "${KERNEL_MODULE_DIR}"

          echo
          echo "Kernel headers:"
          echo "${KERNEL_DIR}"

          echo
          echo "Header internal release:"
          echo "${HEADER_RELEASE}"

          echo
          echo "Kernel config:"

          if [ -f "${KERNEL_DIR}/.config" ]; then
            grep \
              -E \
              '^CONFIG_SMP=|^CONFIG_PREEMPT=|^CONFIG_PREEMPT_RT=|^CONFIG_MODULES=|^CONFIG_MODULE_UNLOAD=' \
              "${KERNEL_DIR}/.config" \
              || true
          fi

          echo
          echo "Module.symvers:"

          if [ -f "${KERNEL_DIR}/Module.symvers" ]; then
            ls -lh \
              "${KERNEL_DIR}/Module.symvers"
          fi

      - name: Build alsa_bridge
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "BUILD ALSA_BRIDGE.KO"
          echo "=========================================="

          echo
          echo "XanMod kernel:"
          echo "${XANMOD_KERNEL_RELEASE}"

          echo
          echo "Kernel headers:"
          echo "${KERNEL_DIR}"

          echo
          echo "Header internal release:"
          echo "${HEADER_RELEASE}"

          echo
          echo "Module source:"
          echo "${GITHUB_WORKSPACE}/daphile-diretta-build"

          echo
          echo "=========================================="
          echo "BUILD"
          echo "=========================================="

          make \
            -C "${KERNEL_DIR}" \
            ARCH=x86_64 \
            M="${GITHUB_WORKSPACE}/daphile-diretta-build" \
            modules

      - name: Verify built module
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFY ALSA_BRIDGE.KO"
          echo "=========================================="

          KO="${GITHUB_WORKSPACE}/daphile-diretta-build/alsa_bridge.ko"

          if [ ! -f "${KO}" ]; then
            echo
            echo "ERROR: alsa_bridge.ko was not created."
            exit 1
          fi

          echo
          echo "Module:"
          ls -lh "${KO}"

          echo
          echo "File type:"
          file "${KO}"

          echo
          echo "=========================================="
          echo "MODINFO"
          echo "=========================================="

          modinfo "${KO}"

          echo
          echo "=========================================="
          echo "BUILT MODULE VERMAGIC"
          echo "=========================================="

          BUILT_VERMAGIC="$(
            modinfo \
              -F vermagic \
              "${KO}"
          )"

          echo "${BUILT_VERMAGIC}"

          if [ -z "${BUILT_VERMAGIC}" ]; then
            echo
            echo "ERROR: unable to read module vermagic."
            exit 1
          fi

          echo
          echo "Built module vermagic successfully detected."

          echo "BUILT_VERMAGIC=${BUILT_VERMAGIC}" >> "${GITHUB_ENV}"

      - name: Compare module vermagic with XanMod
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "COMPARE VERMAGIC"
          echo "=========================================="

          echo
          echo "Built module:"
          echo "${BUILT_VERMAGIC}"

          echo
          echo "XanMod kernel:"
          echo "${XANMOD_KERNEL_RELEASE}"

          echo
          echo "Searching for installed XanMod module vermagic..."

          XANMOD_VERMAGIC=""

          while IFS= read -r module; do

            case "${module}" in

              *.ko)
                value="$(
                  modinfo \
                    -F vermagic \
                    "${module}" \
                    2>/dev/null \
                    || true
                )
                ;;

              *)
                value=""
                ;;

            esac

            if [ -n "${value}" ]; then
              XANMOD_VERMAGIC="${value}"
              break
            fi

          done < <(
            find \
              "${KERNEL_MODULE_DIR}/kernel" \
              -type f \
              -name '*.ko' \
              2>/dev/null
          )

          if [ -z "${XANMOD_VERMAGIC}" ]; then
            echo
            echo "WARNING: Unable to read vermagic from an installed"
            echo "uncompressed XanMod module."

            echo
            echo "Checking installed kernel module tree instead."

            if [ -d "${KERNEL_MODULE_DIR}/kernel" ]; then
              echo
              echo "XanMod module tree exists:"
              find \
                "${KERNEL_MODULE_DIR}/kernel" \
                -type f \
                | head -20
            fi

            echo
            echo "Because XanMod headers report:"
            echo "${HEADER_RELEASE}"

            echo "the module build is accepted if the built"
            echo "module starts with the header release."

            case "${BUILT_VERMAGIC}" in
              "${HEADER_RELEASE}"*)
                echo
                echo "VERMAGIC PREFIX VERIFIED."
                ;;
              *)
                echo
                echo "ERROR: built module vermagic does not match"
                echo "the XanMod header release."

                echo
                echo "Header release:"
                echo "${HEADER_RELEASE}"

                echo
                echo "Built vermagic:"
                echo "${BUILT_VERMAGIC}"

                exit 1
                ;;
            esac

          else

            echo
            echo "Installed XanMod vermagic:"
            echo "${XANMOD_VERMAGIC}"

            echo
            echo "Built module vermagic:"
            echo "${BUILT_VERMAGIC}"

            if [ "${BUILT_VERMAGIC}" != "${XANMOD_VERMAGIC}" ]; then
              echo
              echo "ERROR: VERMAGIC mismatch."
              echo
              echo "XanMod:"
              echo "${XANMOD_VERMAGIC}"
              echo
              echo "Built:"
              echo "${BUILT_VERMAGIC}"
              exit 1
            fi

            echo
            echo "VERMAGIC EXACT MATCH VERIFIED."

          fi

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "PREPARE RELEASE FILES"
          echo "=========================================="

          rm -rf release

          mkdir -p release

          cp \
            daphile-diretta-build/alsa_bridge.ko \
            release/alsa_bridge.ko

          cp \
            daphile-diretta-build/alsa_bridge.c \
            release/alsa_bridge.c

          cp \
            daphile-diretta-build/alsa_bridge.h \
            release/alsa_bridge.h

          cp \
            daphile-diretta-build/Makefile \
            release/Makefile

          printf '%s\n' \
            "${XANMOD_KERNEL_RELEASE}" \
            > release/kernel.release

          echo
          echo "Release files:"
          ls -lh release

      - name: Create build info
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CREATE BUILD INFO"
          echo "=========================================="

          COMPILER_VERSION="$(
            gcc --version | head -1
          )"

          BUILD_DATE="$(
            date -u '+%Y-%m-%d %H:%M:%S UTC'
          )"

          printf '%s\n' \
            "Kernel release: ${XANMOD_KERNEL_RELEASE}" \
            "Header release: ${HEADER_RELEASE}" \
            "Kernel family: XanMod RT x64v2" \
            "Module: alsa_bridge" \
            "Compiler: ${COMPILER_VERSION}" \
            "Module vermagic: ${BUILT_VERMAGIC}" \
            "Build date: ${BUILD_DATE}" \
            "Source: ${DIRETTA_SOURCE_BASE}" \
            > release/build-info.txt

          echo
          cat release/build-info.txt

      - name: Create checksum
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CREATE SHA256SUMS"
          echo "=========================================="

          cd release

          sha256sum \
            alsa_bridge.ko \
            alsa_bridge.c \
            alsa_bridge.h \
            Makefile \
            kernel.release \
            build-info.txt \
            > SHA256SUMS

          echo
          cat SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: alsa-bridge-${{ env.XANMOD_KERNEL_RELEASE }}
          path: release

      - name: Final verification
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "FINAL VERIFICATION"
          echo "=========================================="

          echo
          echo "XanMod kernel:"
          cat release/kernel.release

          echo
          echo "Header release:"
          echo "${HEADER_RELEASE}"

          echo
          echo "Module:"
          ls -lh \
            release/alsa_bridge.ko

          echo
          echo "Module vermagic:"
          modinfo \
            -F vermagic \
            release/alsa_bridge.ko

          echo
          echo "Module name:"
          modinfo \
            -F name \
            release/alsa_bridge.ko

          echo
          echo "=========================================="
          echo "BUILD SUCCESS"
          echo "=========================================="

          echo
          echo "Release files:"
          ls -lh release
