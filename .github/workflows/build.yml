name: Build Diretta ALSA Bridge - XanMod RT x64v2

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  XANMOD_KERNEL_RELEASE: "6.18.52-rt-x64v2-xanmod1"
  DIRETTA_SOURCE_BASE: "https://gabe.babe123.top/DirettaAlsaHost"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # Install build dependencies
      # ============================================================

      - name: Install dependencies
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "INSTALL BUILD DEPENDENCIES"
          echo "=========================================="

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            make \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            dwarves \
            xz-utils \
            wget \
            curl \
            kmod \
            clang-21 \
            lld-21 \
            llvm-21

          echo
          echo "Installed compilers:"
          clang-21 --version
          echo
          gcc --version | head -1

      # ============================================================
      # Install XanMod RT x64v2
      # ============================================================

      - name: Install XanMod RT x64v2
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "INSTALL XANMOD RT X64V2"
          echo "=========================================="

          echo
          echo "Installing XanMod repository..."

          sudo mkdir -p /etc/apt/keyrings

          echo
          echo "Downloading XanMod repository key..."

          wget -q \
            "https://gabe.babe123.top/archive.key" \
            -O /tmp/xanmod-archive.key

          test -s /tmp/xanmod-archive.key

          echo
          echo "Key file:"
          ls -lh /tmp/xanmod-archive.key

          sudo gpg \
            --dearmor \
            -o /etc/apt/keyrings/xanmod-archive-keyring.gpg \
            /tmp/xanmod-archive.key

          echo
          echo "Adding XanMod repository..."

          echo \
            "deb [signed-by=/etc/apt/keyrings/xanmod-archive-keyring.gpg] http://deb.xanmod.org noble main" \
            | sudo tee /etc/apt/sources.list.d/xanmod-release.list

          echo
          echo "Updating APT..."

          sudo apt-get update

          echo
          echo "Installing XanMod RT x64v2..."

          sudo apt-get install -y \
            linux-xanmod-rt-x64v2

          echo
          echo "XanMod installation completed."

      # ============================================================
      # Verify XanMod packages
      # ============================================================

      - name: Verify XanMod installation
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFY XANMOD INSTALLATION"
          echo "=========================================="

          echo
          echo "Installed XanMod packages:"

          dpkg -l | grep -E \
            'linux-(headers|image|xanmod-rt-x64v2)' \
            || true

          echo
          echo "Installed kernel images:"

          ls -lh \
            /boot/vmlinuz-*xanmod* \
            2>/dev/null \
            || true

          echo
          echo "Installed header directories:"

          ls -ld \
            /usr/src/linux-headers-*xanmod* \
            2>/dev/null \
            || true

      # ============================================================
      # Detect XanMod RT headers
      # ============================================================

      - name: Detect XanMod RT headers
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DETECT XANMOD RT HEADERS"
          echo "=========================================="

          echo
          echo "Available headers:"

          ls -ld \
            /usr/src/linux-headers-* \
            2>/dev/null \
            || true

          echo
          echo "Installed XanMod packages:"

          dpkg -l | grep -E \
            'linux-(headers|image|xanmod-rt-x64v2)' \
            || true

          echo
          echo "Searching for XanMod RT x64v2 headers..."

          HEADER_DIR=""

          for dir in /usr/src/linux-headers-*-rt-x64v2-xanmod*; do
            if [ -d "${dir}" ]; then
              HEADER_DIR="${dir}"
              break
            fi
          done

          if [ -z "${HEADER_DIR}" ]; then
            echo
            echo "ERROR: XanMod RT x64v2 headers not found."
            echo
            echo "Available /usr/src directories:"

            find /usr/src \
              -maxdepth 1 \
              -type d \
              -name 'linux-*' \
              -print \
              | sort

            exit 1
          fi

          echo
          echo "XanMod RT headers found:"
          echo "${HEADER_DIR}"

          echo
          echo "Header directory:"
          ls -ld "${HEADER_DIR}"

          echo
          echo "Header Makefile:"
          ls -lh \
            "${HEADER_DIR}/Makefile"

          echo
          echo "Kernel release reported by headers:"

          ACTUAL_RELEASE="$(
            make \
              -s \
              -C "${HEADER_DIR}" \
              kernelrelease
          )"

          echo "${ACTUAL_RELEASE}"

          echo
          echo "Expected XanMod package release:"
          echo "${XANMOD_KERNEL_RELEASE}"

          echo
          echo "Important:"
          echo "The XanMod header Makefile may report:"
          echo "6.18.52-rt-x64v2"
          echo
          echo "while the installed package/kernel release is:"
          echo "6.18.52-rt-x64v2-xanmod1"

          case "${ACTUAL_RELEASE}" in
            6.18.52-rt-x64v2*)
              echo
              echo "Kernel release family is correct."
              ;;
            *)
              echo
              echo "ERROR: unexpected XanMod kernel release:"
              echo "${ACTUAL_RELEASE}"
              exit 1
              ;;
          esac

          echo
          echo "XANMOD RT HEADERS FOUND."

          echo
          echo "HEADER_DIR=${HEADER_DIR}"

          echo "HEADER_DIR=${HEADER_DIR}" >> "${GITHUB_ENV}"

      # ============================================================
      # Verify installed XanMod kernel modules
      # ============================================================

      - name: Verify XanMod installed modules
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFY XANMOD INSTALLED MODULES"
          echo "=========================================="

          echo
          echo "Searching installed XanMod modules..."

          MODULE_DIRS=()

          for dir in \
            /lib/modules/*xanmod* \
            /usr/lib/modules/*xanmod*
          do
            if [ -d "${dir}" ]; then
              MODULE_DIRS+=("${dir}")
            fi
          done

          if [ "${#MODULE_DIRS[@]}" -eq 0 ]; then
            echo
            echo "WARNING: no XanMod module directory found."
            echo
            echo "This is not fatal because the external module"
            echo "will be compiled against the installed headers."
          else
            echo
            echo "XanMod module directories:"

            printf '%s\n' "${MODULE_DIRS[@]}"
          fi

          echo
          echo "Installed XanMod packages:"

          dpkg -l | grep \
            'linux-xanmod-rt-x64v2' \
            || true

          echo
          echo "Installed XanMod kernel image:"

          dpkg -l | grep \
            'linux-image-.*xanmod' \
            || true

          echo
          echo "Installed XanMod headers:"

          dpkg -l | grep \
            'linux-headers-.*xanmod' \
            || true

          echo
          echo "XanMod package verification completed."

      # ============================================================
      # Download only required Diretta source files
      # ============================================================

      - name: Download Diretta ALSA Bridge source
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DOWNLOAD DIRETTA ALSA BRIDGE SOURCE"
          echo "=========================================="

          echo
          echo "Source base:"
          echo "${DIRETTA_SOURCE_BASE}"

          rm -rf daphile-diretta-build

          mkdir -p daphile-diretta-build

          cd daphile-diretta-build

          echo
          echo "Downloading required source files..."

          echo
          echo "Downloading:"
          echo "alsa_bridge.c"

          wget -q \
            "${DIRETTA_SOURCE_BASE}/alsa_bridge.c" \
            -O alsa_bridge.c

          test -s alsa_bridge.c

          echo
          echo "Downloading:"
          echo "alsa_bridge.h"

          wget -q \
            "${DIRETTA_SOURCE_BASE}/alsa_bridge.h" \
            -O alsa_bridge.h

          test -s alsa_bridge.h

          echo
          echo "Downloading:"
          echo "Makefile"

          wget -q \
            "${DIRETTA_SOURCE_BASE}/Makefile" \
            -O Makefile

          test -s Makefile

          echo
          echo "Downloaded source files:"

          ls -lh \
            alsa_bridge.c \
            alsa_bridge.h \
            Makefile

          echo
          echo "=== Makefile ==="

          cat Makefile

      # ============================================================
      # Prepare writable external module build tree
      # ============================================================

      - name: Prepare kernel headers
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "PREPARE KERNEL HEADERS"
          echo "=========================================="

          echo
          echo "Read-only kernel headers:"
          echo "${HEADER_DIR}"

          KERNEL_BUILD="${GITHUB_WORKSPACE}/kernel-build"

          echo
          echo "Writable build directory:"
          echo "${KERNEL_BUILD}"

          rm -rf "${KERNEL_BUILD}"

          mkdir -p "${KERNEL_BUILD}"

          echo
          echo "Preparing external module build output..."

          make \
            -C "${HEADER_DIR}" \
            O="${KERNEL_BUILD}" \
            ARCH=x86_64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

          echo
          echo "Kernel build output prepared."

          echo
          echo "Build tree:"
          ls -ld "${KERNEL_BUILD}"

          echo
          echo "Generated configuration:"
          test -f "${KERNEL_BUILD}/.config"

          echo
          echo "Kernel release from build tree:"

          make \
            -s \
            -C "${KERNEL_BUILD}" \
            kernelrelease

          echo
          echo "KERNEL_BUILD=${KERNEL_BUILD}" >> "${GITHUB_ENV}"

      # ============================================================
      # Verify compiler
      # ============================================================

      - name: Verify XanMod compiler
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFY XANMOD COMPILER"
          echo "=========================================="

          echo
          echo "clang-21:"

          clang-21 --version

          echo
          echo "clang path:"

          command -v clang-21

          echo
          echo "LLVM 21:"

          llvm-config-21 --version

          echo
          echo "Kernel compiler configuration:"

          grep \
            -E \
            '^CONFIG_CC_VERSION_TEXT=' \
            "${KERNEL_BUILD}/.config" \
            || true

          echo
          echo "Using compiler:"
          echo "clang-21"

      # ============================================================
      # Check kernel release
      # ============================================================

      - name: Check kernel release
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CHECK KERNEL RELEASE"
          echo "=========================================="

          echo
          echo "Kernel build tree:"
          echo "${KERNEL_BUILD}"

          ACTUAL_RELEASE="$(
            make \
              -s \
              -C "${KERNEL_BUILD}" \
              kernelrelease
          )"

          echo
          echo "Kernel release:"
          echo "${ACTUAL_RELEASE}"

          case "${ACTUAL_RELEASE}" in
            6.18.52-rt-x64v2*)
              echo
              echo "Kernel release family verified."
              ;;
            *)
              echo
              echo "ERROR: unexpected kernel release:"
              echo "${ACTUAL_RELEASE}"
              exit 1
              ;;
          esac

      # ============================================================
      # Build alsa_bridge with Clang 21
      # ============================================================

      - name: Build alsa_bridge
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "BUILD ALSA_BRIDGE"
          echo "=========================================="

          echo
          echo "Kernel build tree:"
          echo "${KERNEL_BUILD}"

          echo
          echo "Kernel release:"

          make \
            -s \
            -C "${KERNEL_BUILD}" \
            kernelrelease

          echo
          echo "Module source:"
          echo "${GITHUB_WORKSPACE}/daphile-diretta-build"

          echo
          echo "=== Makefile ==="

          cat \
            "${GITHUB_WORKSPACE}/daphile-diretta-build/Makefile"

          echo
          echo "=== Compiler ==="

          clang-21 --version

          echo
          echo "=== BUILD ==="

          make \
            -C "${KERNEL_BUILD}" \
            ARCH=x86_64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang-21 \
            M="${GITHUB_WORKSPACE}/daphile-diretta-build" \
            modules

      # ============================================================
      # Verify module
      # ============================================================

      - name: Verify module
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFY ALSA_BRIDGE MODULE"
          echo "=========================================="

          KO="${GITHUB_WORKSPACE}/daphile-diretta-build/alsa_bridge.ko"

          if [ ! -f "${KO}" ]; then
            echo
            echo "ERROR: alsa_bridge.ko was not created."
            exit 1
          fi

          echo
          echo "Module:"
          ls -lh "${KO}"

          echo
          echo "File:"
          file "${KO}"

          echo
          echo "modinfo:"
          modinfo "${KO}"

          echo
          echo "vermagic:"
          modinfo -F vermagic "${KO}"

          echo
          echo "Kernel release:"
          make \
            -s \
            -C "${KERNEL_BUILD}" \
            kernelrelease

      # ============================================================
      # Prepare release files
      # ============================================================

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "PREPARE RELEASE FILES"
          echo "=========================================="

          rm -rf release

          mkdir -p release

          cp \
            daphile-diretta-build/alsa_bridge.ko \
            release/alsa_bridge.ko

          cp \
            daphile-diretta-build/alsa_bridge.c \
            release/alsa_bridge.c

          cp \
            daphile-diretta-build/alsa_bridge.h \
            release/alsa_bridge.h

          cp \
            daphile-diretta-build/Makefile \
            release/Makefile

          make \
            -s \
            -C "${KERNEL_BUILD}" \
            kernelrelease \
            > release/kernel.release

          echo
          echo "Release kernel:"
          cat release/kernel.release

          echo
          echo "Release files:"
          ls -lh release

      # ============================================================
      # Build information
      # ============================================================

      - name: Create build info
        shell: bash
        run: |
          set -euo pipefail

          KERNEL_RELEASE_ACTUAL="$(
            cat release/kernel.release
          )"

          COMPILER_VERSION="$(
            clang-21 --version \
            | head -1
          )"

          BUILD_DATE="$(
            date -u '+%Y-%m-%d %H:%M:%S UTC'
          )"

          printf '%s\n' \
            "Kernel release: ${KERNEL_RELEASE_ACTUAL}" \
            "Module: alsa_bridge" \
            "Compiler: ${COMPILER_VERSION}" \
            "Architecture: x86_64" \
            "Kernel headers: ${HEADER_DIR}" \
            "Build date: ${BUILD_DATE}" \
            "Diretta source: ${DIRETTA_SOURCE_BASE}" \
            > release/build-info.txt

          echo
          echo "=== build-info.txt ==="

          cat release/build-info.txt

      # ============================================================
      # SHA256
      # ============================================================

      - name: Create checksum
        shell: bash
        run: |
          set -euo pipefail

          cd release

          sha256sum \
            alsa_bridge.ko \
            kernel.release \
            build-info.txt \
            > SHA256SUMS

          echo
          echo "=== SHA256SUMS ==="

          cat SHA256SUMS

      # ============================================================
      # Upload artifact
      # ============================================================

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: alsa-bridge-xanmod-rt-x64v2
          path: release

      # ============================================================
      # Final result
      # ============================================================

      - name: Show final files
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "BUILD SUCCESS"
          echo "=========================================="

          echo
          echo "=== Release files ==="

          ls -lh release

          echo
          echo "=== Module info ==="

          modinfo \
            release/alsa_bridge.ko

          echo
          echo "=== vermagic ==="

          modinfo \
            -F vermagic \
            release/alsa_bridge.ko

          echo
          echo "=== Kernel release ==="

          cat \
            release/kernel.release

          echo
          echo "=========================================="
          echo "XANMOD RT ALSA_BRIDGE BUILD COMPLETE"
          echo "=========================================="
