name: Build Diretta ALSA Bridge for XanMod RT x64v2

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  XANMOD_PACKAGE: "linux-xanmod-rt-x64v2"
  DIRETTA_BASE_URL: "https://gabe.babe123.top/DirettaAlsaHost"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # Install basic dependencies
      # ============================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Install build dependencies"
          echo "=========================================="

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            make \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            dwarves \
            cpio \
            rsync \
            kmod \
            xz-utils \
            zstd \
            wget \
            curl \
            ca-certificates \
            file \
            jq

      # ============================================================
      # Add XanMod repository
      # ============================================================

      - name: Add XanMod APT repository
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Add XanMod APT repository"
          echo "=========================================="

          sudo apt-get update

          echo
          echo "Downloading official XanMod repository package..."

          wget \
            --https-only \
            --server-response \
            --output-document=xanmod-repository.deb \
            https://dl.xanmod.org/xanmod-repository.deb

          echo
          echo "Repository package:"
          ls -lh xanmod-repository.deb

          echo
          echo "Installing XanMod repository..."

          sudo dpkg -i ./xanmod-repository.deb

          echo
          echo "=========================================="
          echo "XanMod repository installed"
          echo "=========================================="

          echo
          echo "APT source files:"

          sudo find /etc/apt/sources.list.d \
            -maxdepth 1 \
            -type f \
            -print \
            -exec sh -c 'echo "--- $1"; cat "$1"' _ {} \; \
            || true

          echo
          echo "APT update..."

          sudo apt-get update

      # ============================================================
      # Check XanMod package
      # ============================================================

      - name: Check XanMod package
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Check XanMod package"
          echo "=========================================="

          echo
          echo "Package:"
          echo "${XANMOD_PACKAGE}"

          echo
          echo "APT candidate:"

          apt-cache policy "${XANMOD_PACKAGE}"

          echo
          echo "Available XanMod RT packages:"

          apt-cache search \
            '^linux-xanmod-rt' \
            | sort \
            || true

      # ============================================================
      # Install XanMod RT x64v2
      # ============================================================

      - name: Install XanMod RT x64v2
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Install XanMod RT x64v2"
          echo "=========================================="

          sudo apt-get install -y \
            "${XANMOD_PACKAGE}"

          echo
          echo "=========================================="
          echo "Installed XanMod packages"
          echo "=========================================="

          dpkg -l \
            | grep -E 'linux-(image|headers|modules).*xanmod' \
            || true

      # ============================================================
      # Detect installed XanMod kernel
      # ============================================================

      - name: Detect XanMod kernel
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Detect XanMod RT kernel"
          echo "=========================================="

          echo
          echo "Installed kernel directories:"
          ls -1 /lib/modules/ \
            || true

          echo
          echo "Searching for XanMod RT x64v2..."

          mapfile -t XANMOD_KERNELS < <(
            find /lib/modules \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%f\n' \
              | grep -E 'xanmod.*rt.*x64v2' \
              | sort -V
          )

          if [ "${#XANMOD_KERNELS[@]}" -eq 0 ]; then
            echo
            echo "ERROR: No XanMod RT x64v2 kernel found."
            echo
            echo "Installed /lib/modules:"
            find /lib/modules \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%f\n' \
              | sort -V
            exit 1
          fi

          XANMOD_RELEASE="${XANMOD_KERNELS[0]}"

          echo
          echo "Detected XanMod kernel:"
          echo "${XANMOD_RELEASE}"

          echo
          echo "All matching kernels:"
          printf '%s\n' "${XANMOD_KERNELS[@]}"

          echo
          echo "Checking kernel build directory..."

          KERNEL_BUILD="/lib/modules/${XANMOD_RELEASE}/build"

          if [ ! -e "${KERNEL_BUILD}" ]; then
            echo "ERROR: Kernel build directory does not exist:"
            echo "${KERNEL_BUILD}"
            exit 1
          fi

          echo
          echo "Kernel build:"
          readlink -f "${KERNEL_BUILD}"

          echo
          echo "Checking source directory..."

          KERNEL_SOURCE="/lib/modules/${XANMOD_RELEASE}/source"

          if [ -e "${KERNEL_SOURCE}" ]; then
            echo "Kernel source:"
            readlink -f "${KERNEL_SOURCE}"
          else
            echo "No source symlink."
          fi

          echo
          echo "Exporting environment..."

          echo "XANMOD_RELEASE=${XANMOD_RELEASE}" >> "${GITHUB_ENV}"
          echo "KERNEL_BUILD=${KERNEL_BUILD}" >> "${GITHUB_ENV}"

      # ============================================================
      # Verify kernel headers
      # ============================================================

      - name: Verify XanMod kernel headers
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Verify XanMod kernel headers"
          echo "=========================================="

          echo
          echo "Kernel release:"
          echo "${XANMOD_RELEASE}"

          echo
          echo "Kernel build:"
          echo "${KERNEL_BUILD}"

          echo
          echo "Build tree:"
          ls -ld \
            "${KERNEL_BUILD}"

          echo
          echo "Kernel Makefile:"
          ls -lh \
            "${KERNEL_BUILD}/Makefile"

          echo
          echo "Kernel config:"
          ls -lh \
            "${KERNEL_BUILD}/.config" \
            || true

          echo
          echo "Module.symvers:"
          ls -lh \
            "${KERNEL_BUILD}/Module.symvers" \
            || true

          echo
          echo "Kernel release reported by build tree:"

          BUILD_RELEASE="$(
            make \
              -s \
              -C "${KERNEL_BUILD}" \
              kernelrelease
          )"

          echo "${BUILD_RELEASE}"

          if [ "${BUILD_RELEASE}" != "${XANMOD_RELEASE}" ]; then
            echo
            echo "ERROR: kernel release mismatch."
            echo "Detected: ${XANMOD_RELEASE}"
            echo "Build tree: ${BUILD_RELEASE}"
            exit 1
          fi

          echo
          echo "Kernel headers/build tree are correct."

      # ============================================================
      # Show kernel configuration
      # ============================================================

      - name: Show XanMod kernel configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "XanMod kernel configuration"
          echo "=========================================="

          if [ -f "${KERNEL_BUILD}/.config" ]; then

            echo
            echo "CONFIG_PREEMPT:"
            grep '^CONFIG_PREEMPT=' \
              "${KERNEL_BUILD}/.config" \
              || true

            echo
            echo "CONFIG_PREEMPT_RT:"
            grep '^CONFIG_PREEMPT_RT=' \
              "${KERNEL_BUILD}/.config" \
              || true

            echo
            echo "CONFIG_SMP:"
            grep '^CONFIG_SMP=' \
              "${KERNEL_BUILD}/.config" \
              || true

            echo
            echo "CONFIG_MODULES:"
            grep '^CONFIG_MODULES=' \
              "${KERNEL_BUILD}/.config" \
              || true

          fi

      # ============================================================
      # Download Diretta ALSA Host source
      # ============================================================

      - name: Download Diretta ALSA Host source
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Download Diretta ALSA Host source"
          echo "=========================================="

          rm -rf diretta-source

          mkdir -p diretta-source

          echo
          echo "Source URL:"
          echo "${DIRETTA_BASE_URL}"

          echo
          echo "Downloading directory listing..."

          curl \
            --fail \
            --show-error \
            --location \
            "${DIRETTA_BASE_URL}/" \
            -o diretta-source/index.html

          echo
          echo "Directory listing:"
          sed -n '1,200p' \
            diretta-source/index.html

      # ============================================================
      # Locate ALSA bridge source
      # ============================================================

      - name: Locate ALSA bridge source
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Locate alsa_bridge source"
          echo "=========================================="

          echo
          echo "Repository files:"
          find . \
            -maxdepth 4 \
            -type f \
            -print \
            | sort

          echo
          echo "Checking Diretta source directory..."

          find diretta-source \
            -maxdepth 3 \
            -type f \
            -print \
            | sort

      # ============================================================
      # Download known Diretta source files
      #
      # The source URL is expected to expose the ALSA bridge
      # source files directly or inside a directory.
      # ============================================================

      - name: Download ALSA bridge files
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Download ALSA bridge files"
          echo "=========================================="

          mkdir -p daphile-diretta-build

          echo
          echo "Attempting to download alsa_bridge.c..."

          if curl \
            --fail \
            --show-error \
            --location \
            "${DIRETTA_BASE_URL}/alsa_bridge.c" \
            -o daphile-diretta-build/alsa_bridge.c
          then
            echo "Downloaded alsa_bridge.c"
          else
            echo "ERROR: alsa_bridge.c was not found at:"
            echo "${DIRETTA_BASE_URL}/alsa_bridge.c"
            exit 1
          fi

          echo
          echo "Attempting to download alsa_bridge.h..."

          if curl \
            --fail \
            --show-error \
            --location \
            "${DIRETTA_BASE_URL}/alsa_bridge.h" \
            -o daphile-diretta-build/alsa_bridge.h
          then
            echo "Downloaded alsa_bridge.h"
          else
            echo "WARNING: alsa_bridge.h not found."
          fi

          echo
          echo "Attempting to download Makefile..."

          if curl \
            --fail \
            --show-error \
            --location \
            "${DIRETTA_BASE_URL}/Makefile" \
            -o daphile-diretta-build/Makefile
          then
            echo "Downloaded Makefile"
          else
            echo "WARNING: Makefile not found."
          fi

          echo
          echo "Downloaded files:"
          find daphile-diretta-build \
            -maxdepth 1 \
            -type f \
            -ls

      # ============================================================
      # Verify source
      # ============================================================

      - name: Verify Diretta source
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Verify Diretta source"
          echo "=========================================="

          echo
          echo "Files:"
          find daphile-diretta-build \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

          echo
          echo "alsa_bridge.c:"
          ls -lh \
            daphile-diretta-build/alsa_bridge.c

          echo
          echo "Source header:"
          head -40 \
            daphile-diretta-build/alsa_bridge.c

          if [ ! -f daphile-diretta-build/Makefile ]; then
            echo
            echo "ERROR: Makefile not found."
            echo
            echo "The Diretta server does not expose a Makefile."
            echo "A Makefile must be supplied by the source tree."
            exit 1
          fi

          echo
          echo "Makefile:"
          cat daphile-diretta-build/Makefile

      # ============================================================
      # Build ALSA bridge
      # ============================================================

      - name: Build alsa_bridge
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Build alsa_bridge.ko"
          echo "=========================================="

          echo
          echo "Target kernel:"
          echo "${XANMOD_RELEASE}"

          echo
          echo "Kernel build tree:"
          echo "${KERNEL_BUILD}"

          echo
          echo "Compiler:"
          gcc --version | head -1

          echo
          echo "Module source:"
          find daphile-diretta-build \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

          echo
          echo "=========================================="
          echo "KERNEL MODULE BUILD"
          echo "=========================================="

          make \
            -C "${KERNEL_BUILD}" \
            ARCH=x86_64 \
            M="${GITHUB_WORKSPACE}/daphile-diretta-build" \
            modules

      # ============================================================
      # Verify module
      # ============================================================

      - name: Verify module
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Verify alsa_bridge.ko"
          echo "=========================================="

          KO="${GITHUB_WORKSPACE}/daphile-diretta-build/alsa_bridge.ko"

          if [ ! -f "${KO}" ]; then
            echo
            echo "ERROR: alsa_bridge.ko was not created."
            echo
            echo "Build directory:"
            find daphile-diretta-build \
              -maxdepth 2 \
              -type f \
              -print \
              | sort
            exit 1
          fi

          echo
          echo "Module:"
          ls -lh "${KO}"

          echo
          echo "File:"
          file "${KO}"

          echo
          echo "modinfo:"
          modinfo "${KO}"

          echo
          echo "vermagic:"
          modinfo -F vermagic "${KO}"

      # ============================================================
      # Verify vermagic against target kernel
      # ============================================================

      - name: Verify module vermagic
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Verify module vermagic"
          echo "=========================================="

          KO="${GITHUB_WORKSPACE}/daphile-diretta-build/alsa_bridge.ko"

          VERMAGIC="$(modinfo -F vermagic "${KO}")"

          echo
          echo "Kernel release:"
          echo "${XANMOD_RELEASE}"

          echo
          echo "Module vermagic:"
          echo "${VERMAGIC}"

          case "${VERMAGIC}" in
            "${XANMOD_RELEASE}"\ *)
              echo
              echo "=========================================="
              echo "VERMAGIC MATCH"
              echo "=========================================="
              ;;
            *)
              echo
              echo "ERROR: module vermagic does not match target kernel."
              echo
              echo "Expected prefix:"
              echo "${XANMOD_RELEASE}"

              echo
              echo "Actual:"
              echo "${VERMAGIC}"

              exit 1
              ;;
          esac

      # ============================================================
      # Prepare release
      # ============================================================

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Prepare release files"
          echo "=========================================="

          rm -rf release

          mkdir -p release

          cp \
            daphile-diretta-build/alsa_bridge.ko \
            release/alsa_bridge.ko

          cp \
            daphile-diretta-build/alsa_bridge.c \
            release/alsa_bridge.c

          if [ -f daphile-diretta-build/alsa_bridge.h ]; then
            cp \
              daphile-diretta-build/alsa_bridge.h \
              release/alsa_bridge.h
          fi

          cp \
            daphile-diretta-build/Makefile \
            release/Makefile

          printf '%s\n' \
            "${XANMOD_RELEASE}" \
            > release/kernel.release

          echo
          echo "Release files:"
          ls -lh release

      # ============================================================
      # Create build information
      # ============================================================

      - name: Create build info
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Create build info"
          echo "=========================================="

          VERMAGIC="$(modinfo -F vermagic release/alsa_bridge.ko)"

          COMPILER_VERSION="$(
            gcc --version \
              | head -1
          )"

          BUILD_DATE="$(
            date -u '+%Y-%m-%d %H:%M:%S UTC'
          )"

          printf '%s\n' \
            "Target: XanMod RT x64v2" \
            "Kernel package: ${XANMOD_PACKAGE}" \
            "Kernel release: ${XANMOD_RELEASE}" \
            "Module: alsa_bridge" \
            "Compiler: ${COMPILER_VERSION}" \
            "vermagic: ${VERMAGIC}" \
            "Diretta source: ${DIRETTA_BASE_URL}" \
            "Build date: ${BUILD_DATE}" \
            > release/build-info.txt

          echo
          cat release/build-info.txt

      # ============================================================
      # SHA256
      # ============================================================

      - name: Create SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Create SHA256SUMS"
          echo "=========================================="

          cd release

          sha256sum \
            alsa_bridge.ko \
            alsa_bridge.c \
            Makefile \
            kernel.release \
            build-info.txt \
            > SHA256SUMS

          if [ -f alsa_bridge.h ]; then
            sha256sum \
              alsa_bridge.h \
              >> SHA256SUMS
          fi

          echo
          cat SHA256SUMS

      # ============================================================
      # Upload artifact
      # ============================================================

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: alsa-bridge-xanmod-rt-x64v2
          path: release

      # ============================================================
      # Final verification
      # ============================================================

      - name: Final verification
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "FINAL VERIFICATION"
          echo "=========================================="

          echo
          echo "Target kernel:"
          echo "${XANMOD_RELEASE}"

          echo
          echo "Kernel build:"
          make \
            -s \
            -C "${KERNEL_BUILD}" \
            kernelrelease

          echo
          echo "Module:"
          ls -lh \
            release/alsa_bridge.ko

          echo
          echo "vermagic:"
          modinfo \
            -F vermagic \
            release/alsa_bridge.ko

          echo
          echo "SHA256:"
          cat \
            release/SHA256SUMS

          echo
          echo "=========================================="
          echo "BUILD SUCCESS"
          echo "=========================================="

          echo
          echo "alsa_bridge.ko successfully built for:"
          echo "${XANMOD_RELEASE}"
