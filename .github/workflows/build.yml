name: Build Diretta ALSA Bridge for XanMod RT x64v2

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  XANMOD_KERNEL_RELEASE: "6.18.52-rt-x64v2-xanmod1"
  XANMOD_PACKAGE: "linux-xanmod-rt-x64v2"

  DIRETTA_SOURCE_BASE: "https://gabe.babe123.top/DirettaAlsaHost"

  BUILD_DIR: "kernel-build"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # Install build dependencies
      # ============================================================

      - name: Install dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            make \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            dwarves \
            xz-utils \
            wget \
            curl \
            kmod


      # ============================================================
      # Add XanMod repository
      # ============================================================

      - name: Add XanMod repository
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "ADD XANMOD REPOSITORY"
          echo "=========================================="

          sudo mkdir -p /etc/apt/keyrings

          echo
          echo "Downloading XanMod repository key..."

          wget -q \
            "https://gabe.babe123.top/archive.key" \
            -O /tmp/xanmod-archive.key

          test -s /tmp/xanmod-archive.key

          echo
          echo "Installing XanMod key..."

          sudo gpg \
            --dearmor \
            --yes \
            -o /etc/apt/keyrings/xanmod-archive-keyring.gpg \
            /tmp/xanmod-archive.key

          test -s /etc/apt/keyrings/xanmod-archive-keyring.gpg

          echo
          echo "Adding XanMod repository..."

          echo \
            "deb [signed-by=/etc/apt/keyrings/xanmod-archive-keyring.gpg] http://deb.xanmod.org noble main" \
            | sudo tee /etc/apt/sources.list.d/xanmod-release.list

          echo
          echo "Updating package lists..."

          sudo apt-get update


      # ============================================================
      # Install XanMod RT x64v2
      # ============================================================

      - name: Install XanMod RT x64v2
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "INSTALL XANMOD RT X64V2"
          echo "=========================================="

          sudo apt-get install -y \
            linux-xanmod-rt-x64v2

          echo
          echo "Installed XanMod packages:"

          dpkg -l | grep -E \
            'linux-(headers|image|xanmod-rt-x64v2)' \
            || true


      # ============================================================
      # Detect XanMod RT headers
      # ============================================================

      - name: Detect XanMod RT headers
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DETECT XANMOD RT HEADERS"
          echo "=========================================="

          echo
          echo "Available headers:"

          ls -ld \
            /usr/src/linux-headers-* \
            2>/dev/null || true

          echo
          echo "Installed XanMod packages:"

          dpkg -l | grep -E \
            'linux-(headers|image|xanmod-rt-x64v2)' \
            || true

          echo
          echo "Searching for XanMod RT x64v2 headers..."

          HEADER_DIR=""

          for dir in /usr/src/linux-headers-*-rt-x64v2-xanmod*; do
            if [ -d "${dir}" ]; then
              HEADER_DIR="${dir}"
              break
            fi
          done

          if [ -z "${HEADER_DIR}" ]; then
            echo
            echo "ERROR: XanMod RT x64v2 headers not found."
            echo
            echo "Available /usr/src directories:"

            find /usr/src \
              -maxdepth 1 \
              -type d \
              -name 'linux-*' \
              -print \
              | sort

            exit 1
          fi

          echo
          echo "XanMod RT headers found:"
          echo "${HEADER_DIR}"

          echo
          echo "Header directory:"
          ls -ld "${HEADER_DIR}"

          echo
          echo "Header Makefile:"
          ls -lh \
            "${HEADER_DIR}/Makefile"

          echo
          echo "Installed XanMod package:"

          dpkg-query \
            -W \
            -f='${Package} ${Version}\n' \
            "${XANMOD_PACKAGE}"

          echo
          echo "=========================================="
          echo "XANMOD RT HEADERS DETECTED"
          echo "=========================================="

          echo
          echo "Header directory:"
          echo "${HEADER_DIR}"

          echo
          echo "Expected package:"
          echo "${XANMOD_PACKAGE}"

          echo "KERNEL_DIR=${HEADER_DIR}" >> "${GITHUB_ENV}"


      # ============================================================
      # Verify XanMod installation
      # ============================================================

      - name: Verify XanMod installation
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFY XANMOD INSTALLATION"
          echo "=========================================="

          echo
          echo "Package:"

          dpkg-query \
            -W \
            -f='${Package}\n' \
            "${XANMOD_PACKAGE}"

          echo
          echo "Installed packages:"

          dpkg -l | grep -E \
            'linux-(headers|image|xanmod-rt-x64v2)' \
            || true

          echo
          echo "Kernel image:"

          ls -lh \
            "/boot/vmlinuz-${XANMOD_KERNEL_RELEASE}" \
            2>/dev/null || true

          echo
          echo "Headers:"

          ls -ld \
            "${KERNEL_DIR}"

          echo
          echo "=========================================="
          echo "XANMOD INSTALLATION VERIFIED"
          echo "=========================================="


      # ============================================================
      # Download only required Diretta source files
      # ============================================================

      - name: Download Diretta ALSA Bridge source
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DOWNLOAD DIRETTA ALSA BRIDGE SOURCE"
          echo "=========================================="

          echo
          echo "Source base:"
          echo "${DIRETTA_SOURCE_BASE}"

          rm -rf daphile-diretta-build

          mkdir -p daphile-diretta-build

          echo
          echo "Downloading required source files..."

          for file in \
            alsa_bridge.c \
            alsa_bridge.h \
            Makefile
          do
            echo
            echo "Downloading:"
            echo "${file}"

            wget -q \
              "${DIRETTA_SOURCE_BASE}/${file}" \
              -O \
              "daphile-diretta-build/${file}"

            test -s \
              "daphile-diretta-build/${file}"
          done

          echo
          echo "=========================================="
          echo "DIRETTA SOURCE FILES"
          echo "=========================================="

          ls -lh \
            daphile-diretta-build/


      # ============================================================
      # Verify source files
      # ============================================================

      - name: Verify Diretta source
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFY DIRETTA SOURCE"
          echo "=========================================="

          for file in \
            alsa_bridge.c \
            alsa_bridge.h \
            Makefile
          do
            if [ ! -s "daphile-diretta-build/${file}" ]; then
              echo "ERROR: missing source file:"
              echo "${file}"
              exit 1
            fi
          done

          echo
          echo "Source files:"

          find \
            daphile-diretta-build \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          echo
          echo "Makefile:"
          cat daphile-diretta-build/Makefile


      # ============================================================
      # Prepare writable kernel build output
      #
      # IMPORTANT:
      # /usr/src/linux-headers-* is root-owned and must NOT be
      # modified directly.
      #
      # We use O=BUILD_DIR so all generated files go into a
      # writable GitHub Actions workspace.
      # ============================================================

      - name: Prepare kernel headers
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "PREPARE KERNEL HEADERS"
          echo "=========================================="

          echo
          echo "Read-only kernel headers:"
          echo "${KERNEL_DIR}"

          echo
          echo "Writable build directory:"
          echo "${GITHUB_WORKSPACE}/${BUILD_DIR}"

          rm -rf \
            "${GITHUB_WORKSPACE}/${BUILD_DIR}"

          mkdir -p \
            "${GITHUB_WORKSPACE}/${BUILD_DIR}"

          echo
          echo "Preparing external module build output..."

          make \
            -C "${KERNEL_DIR}" \
            O="${GITHUB_WORKSPACE}/${BUILD_DIR}" \
            olddefconfig

          echo
          echo "Kernel build output prepared."

          echo
          echo "Build directory:"

          ls -ld \
            "${GITHUB_WORKSPACE}/${BUILD_DIR}"

          echo
          echo "Generated configuration:"

          test -f \
            "${GITHUB_WORKSPACE}/${BUILD_DIR}/.config"

          ls -lh \
            "${GITHUB_WORKSPACE}/${BUILD_DIR}/.config"


      # ============================================================
      # Verify kernel release
      #
      # XanMod's Makefile reports:
      #   6.18.52-rt-x64v2
      #
      # while the installed Debian package is:
      #   6.18.52-rt-x64v2-xanmod1
      #
      # Therefore we verify both independently.
      # ============================================================

      - name: Verify kernel build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFY KERNEL BUILD ENVIRONMENT"
          echo "=========================================="

          echo
          echo "Header directory:"
          echo "${KERNEL_DIR}"

          echo
          echo "Kernel release reported by headers:"

          HEADER_RELEASE="$(
            make \
              -s \
              -C "${KERNEL_DIR}" \
              O="${GITHUB_WORKSPACE}/${BUILD_DIR}" \
              kernelrelease
          )"

          echo "${HEADER_RELEASE}"

          echo
          echo "Expected kernel release from headers:"
          echo "6.18.52-rt-x64v2"

          if [ "${HEADER_RELEASE}" != "6.18.52-rt-x64v2" ]; then
            echo
            echo "ERROR: unexpected kernel release."
            echo "Actual:   ${HEADER_RELEASE}"
            echo "Expected: 6.18.52-rt-x64v2"
            exit 1
          fi

          echo
          echo "Installed XanMod package:"
          dpkg-query \
            -W \
            -f='${Package} ${Version}\n' \
            "${XANMOD_PACKAGE}"

          echo
          echo "=========================================="
          echo "KERNEL BUILD ENVIRONMENT VERIFIED"
          echo "=========================================="


      # ============================================================
      # Build alsa_bridge
      #
      # IMPORTANT:
      # Use the writable O= build directory.
      # Do NOT write into /usr/src/linux-headers-*.
      # ============================================================

      - name: Build alsa_bridge
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "BUILD ALSA_BRIDGE.KO"
          echo "=========================================="

          echo
          echo "Kernel headers:"
          echo "${KERNEL_DIR}"

          echo
          echo "Kernel build output:"
          echo "${GITHUB_WORKSPACE}/${BUILD_DIR}"

          echo
          echo "Module source:"
          find \
            daphile-diretta-build \
            -maxdepth 1 \
            -type f \
            -print

          echo
          echo "=== Makefile ==="
          cat \
            daphile-diretta-build/Makefile

          echo
          echo "=== BUILD ==="

          make \
            -C "${KERNEL_DIR}" \
            O="${GITHUB_WORKSPACE}/${BUILD_DIR}" \
            ARCH=x86_64 \
            M="${GITHUB_WORKSPACE}/daphile-diretta-build" \
            modules

          echo
          echo "Build completed."


      # ============================================================
      # Verify module
      # ============================================================

      - name: Verify module
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFY ALSA_BRIDGE MODULE"
          echo "=========================================="

          KO="${GITHUB_WORKSPACE}/daphile-diretta-build/alsa_bridge.ko"

          if [ ! -f "${KO}" ]; then
            echo
            echo "ERROR: alsa_bridge.ko was not created."
            echo
            echo "Searching for generated module:"

            find \
              "${GITHUB_WORKSPACE}" \
              -name 'alsa_bridge.ko' \
              -print

            exit 1
          fi

          echo
          echo "Module:"
          ls -lh "${KO}"

          echo
          echo "=== File ==="

          file "${KO}"

          echo
          echo "=== modinfo ==="

          modinfo "${KO}"

          echo
          echo "=== vermagic ==="

          modinfo \
            -F vermagic \
            "${KO}"

          echo
          echo "=========================================="
          echo "ALSA_BRIDGE MODULE VERIFIED"
          echo "=========================================="


      # ============================================================
      # Verify module vermagic
      # ============================================================

      - name: Verify module vermagic
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFY MODULE VERMAGIC"
          echo "=========================================="

          KO="${GITHUB_WORKSPACE}/daphile-diretta-build/alsa_bridge.ko"

          VERMAGIC="$(
            modinfo \
              -F vermagic \
              "${KO}"
          )"

          echo
          echo "Module vermagic:"
          echo "${VERMAGIC}"

          echo
          echo "Expected kernel base:"
          echo "6.18.52-rt-x64v2"

          case "${VERMAGIC}" in
            6.18.52-rt-x64v2\ *)
              echo
              echo "Vermagic kernel version is correct."
              ;;
            *)
              echo
              echo "ERROR: unexpected module vermagic."
              echo "Actual:"
              echo "${VERMAGIC}"
              exit 1
              ;;
          esac

          echo
          echo "=========================================="
          echo "VERMAGIC VERIFIED"
          echo "=========================================="


      # ============================================================
      # Prepare release files
      # ============================================================

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "PREPARE RELEASE FILES"
          echo "=========================================="

          rm -rf release

          mkdir -p release

          cp \
            daphile-diretta-build/alsa_bridge.ko \
            release/alsa_bridge.ko

          cp \
            daphile-diretta-build/alsa_bridge.c \
            release/alsa_bridge.c

          cp \
            daphile-diretta-build/alsa_bridge.h \
            release/alsa_bridge.h

          cp \
            daphile-diretta-build/Makefile \
            release/Makefile

          printf '%s\n' \
            "${XANMOD_KERNEL_RELEASE}" \
            > release/kernel.release

          echo
          echo "Release files:"

          ls -lh \
            release


      # ============================================================
      # Create build information
      # ============================================================

      - name: Create build info
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CREATE BUILD INFO"
          echo "=========================================="

          COMPILER_VERSION="$(
            gcc --version \
              | head -1
          )"

          BUILD_DATE="$(
            date -u '+%Y-%m-%d %H:%M:%S UTC'
          )"

          HEADER_RELEASE="$(
            make \
              -s \
              -C "${KERNEL_DIR}" \
              O="${GITHUB_WORKSPACE}/${BUILD_DIR}" \
              kernelrelease
          )"

          printf '%s\n' \
            "Kernel package: ${XANMOD_PACKAGE}" \
            "Kernel package release: ${XANMOD_KERNEL_RELEASE}" \
            "Kernel headers release: ${HEADER_RELEASE}" \
            "Architecture: x86_64" \
            "CPU target: x86-64-v2" \
            "Kernel flavor: PREEMPT_RT" \
            "Module: alsa_bridge" \
            "Compiler: ${COMPILER_VERSION}" \
            "Build date: ${BUILD_DATE}" \
            "Diretta source: ${DIRETTA_SOURCE_BASE}" \
            > release/build-info.txt

          echo
          cat \
            release/build-info.txt


      # ============================================================
      # Create checksum
      # ============================================================

      - name: Create checksum
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CREATE SHA256"
          echo "=========================================="

          cd release

          sha256sum \
            alsa_bridge.ko \
            alsa_bridge.c \
            alsa_bridge.h \
            Makefile \
            kernel.release \
            build-info.txt \
            > SHA256SUMS

          echo
          cat SHA256SUMS


      # ============================================================
      # Upload artifact
      # ============================================================

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: alsa-bridge-6.18.52-rt-x64v2-xanmod1
          path: release


      # ============================================================
      # Final verification
      # ============================================================

      - name: Final verification
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "BUILD SUCCESS"
          echo "=========================================="

          echo
          echo "=== Release files ==="

          ls -lh \
            release

          echo
          echo "=== Module info ==="

          modinfo \
            release/alsa_bridge.ko

          echo
          echo "=== Module vermagic ==="

          modinfo \
            -F vermagic \
            release/alsa_bridge.ko

          echo
          echo "=== Kernel package ==="

          dpkg-query \
            -W \
            -f='${Package} ${Version}\n' \
            "${XANMOD_PACKAGE}"

          echo
          echo "=========================================="
          echo "XANMOD RT X64V2 ALSA BRIDGE BUILD OK"
          echo "=========================================="
