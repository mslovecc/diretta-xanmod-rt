name: Build Diretta ALSA Bridge - XanMod RT x64v2

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  XANMOD_KERNEL_PACKAGE: "linux-xanmod-rt-x64v2"
  XANMOD_KERNEL_PACKAGE_PREFIX: "linux-xanmod-rt-x64v2"
  XANMOD_KERNEL_RELEASE: "6.18.52-rt-x64v2"
  XANMOD_KERNEL_PACKAGE_VERSION: "6.18.52-rt-xanmod1"

  DIRETTA_SOURCE_BASE: "https://gabe.babe123.top/DirettaAlsaHost"

jobs:

  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # Install basic dependencies
      # ============================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "INSTALL BUILD DEPENDENCIES"
          echo "=========================================="

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            dwarves \
            kmod \
            xz-utils \
            wget \
            curl \
            ca-certificates \
            gnupg \
            lsb-release


      # ============================================================
      # Add XanMod repository
      # ============================================================

      - name: Add XanMod APT repository
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "ADD XANMOD APT REPOSITORY"
          echo "=========================================="

          sudo mkdir -p /etc/apt/keyrings

          echo
          echo "Downloading XanMod repository key..."

          wget -q \
            "${DIRETTA_SOURCE_BASE}/../archive.key" \
            -O /tmp/xanmod-archive.key

          echo
          echo "Downloaded key:"
          ls -lh /tmp/xanmod-archive.key

          test -s /tmp/xanmod-archive.key

          echo
          echo "Importing GPG key..."

          gpg \
            --dearmor \
            < /tmp/xanmod-archive.key \
            | sudo tee \
              /etc/apt/keyrings/xanmod-archive-keyring.gpg \
              >/dev/null

          sudo chmod 644 \
            /etc/apt/keyrings/xanmod-archive-keyring.gpg

          echo
          echo "GPG key installed."

          echo
          echo "Adding XanMod repository..."

          UBUNTU_CODENAME="$(. /etc/os-release && echo "${VERSION_CODENAME}")"

          echo "Ubuntu codename:"
          echo "${UBUNTU_CODENAME}"

          echo \
            "deb [signed-by=/etc/apt/keyrings/xanmod-archive-keyring.gpg] http://deb.xanmod.org ${UBUNTU_CODENAME} main" \
            | sudo tee \
              /etc/apt/sources.list.d/xanmod-release.list \
              >/dev/null

          echo
          echo "Repository configuration:"
          cat /etc/apt/sources.list.d/xanmod-release.list

          echo
          echo "APT update..."

          sudo apt-get update


      # ============================================================
      # Install XanMod RT x64v2
      # ============================================================

      - name: Install XanMod RT x64v2
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "INSTALL XANMOD RT X64V2"
          echo "=========================================="

          echo
          echo "Package:"
          echo "${XANMOD_KERNEL_PACKAGE}"

          sudo apt-get install -y \
            "${XANMOD_KERNEL_PACKAGE}"

          echo
          echo "Installed XanMod packages:"
          dpkg -l \
            | grep -E \
              'linux-(headers|image|xanmod-rt-x64v2)' \
            || true


      # ============================================================
      # Detect XanMod headers
      # ============================================================

      - name: Detect XanMod RT headers
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DETECT XANMOD RT HEADERS"
          echo "=========================================="

          echo
          echo "Available headers:"

          ls -ld \
            /usr/src/linux-headers-* \
            2>/dev/null || true

          echo
          echo "Installed XanMod packages:"

          dpkg -l \
            | grep -E \
              'linux-(headers|image|xanmod-rt-x64v2)' \
            || true

          echo
          echo "Searching for XanMod RT x64v2 headers..."

          HEADER_DIR=""

          for dir in \
            /usr/src/linux-headers-*-rt-x64v2-xanmod* \
            /usr/src/linux-headers-*-rt-x64v2* \
            /usr/src/linux-headers-*xanmod*; do

            if [ -d "${dir}" ]; then
              HEADER_DIR="${dir}"
              break
            fi

          done

          if [ -z "${HEADER_DIR}" ]; then

            echo
            echo "ERROR: XanMod RT x64v2 headers not found."

            echo
            echo "Available /usr/src directories:"

            find /usr/src \
              -maxdepth 1 \
              -type d \
              -name 'linux-*' \
              -print \
              | sort

            exit 1
          fi

          echo
          echo "XanMod RT headers found:"
          echo "${HEADER_DIR}"

          echo
          echo "Header directory:"
          ls -ld "${HEADER_DIR}"

          echo
          echo "Header Makefile:"
          ls -lh \
            "${HEADER_DIR}/Makefile"

          echo
          echo "Kernel release reported by headers:"

          ACTUAL_RELEASE="$(
            make \
              -s \
              -C "${HEADER_DIR}" \
              kernelrelease
          )"

          echo "${ACTUAL_RELEASE}"

          if [ -z "${ACTUAL_RELEASE}" ]; then
            echo
            echo "ERROR: Unable to determine kernel release."
            exit 1
          fi

          echo
          echo "Expected base release:"
          echo "${XANMOD_KERNEL_RELEASE}"

          echo
          echo "IMPORTANT:"
          echo "The XanMod package suffix '-xanmod1'"
          echo "does not necessarily appear in kernelrelease."

          case "${ACTUAL_RELEASE}" in
            "${XANMOD_KERNEL_RELEASE}"*)
              echo
              echo "Kernel release prefix is correct."
              ;;
            *)
              echo
              echo "ERROR: Unexpected XanMod kernel release."
              echo "Expected prefix:"
              echo "${XANMOD_KERNEL_RELEASE}"
              echo "Actual:"
              echo "${ACTUAL_RELEASE}"
              exit 1
              ;;
          esac

          echo
          echo "XANMOD RT HEADERS VERIFIED"

          echo
          echo "Header directory:"
          echo "${HEADER_DIR}"

          echo
          echo "Kernel release:"
          echo "${ACTUAL_RELEASE}"

          echo "KERNEL_DIR=${HEADER_DIR}" >> "${GITHUB_ENV}"
          echo "XANMOD_ACTUAL_RELEASE=${ACTUAL_RELEASE}" >> "${GITHUB_ENV}"


      # ============================================================
      # Verify installed XanMod modules
      #
      # IMPORTANT:
      # This is informational only.
      # External module compilation does NOT require a complete
      # /lib/modules/<kernelrelease> tree.
      # ============================================================

      - name: Verify XanMod installed modules
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFY XANMOD INSTALLED MODULES"
          echo "=========================================="

          echo
          echo "Target kernel:"
          echo "${XANMOD_ACTUAL_RELEASE}"

          echo
          echo "Installed XanMod packages:"

          dpkg-query \
            -W \
            -f='${binary:Package}\t${Version}\n' \
            2>/dev/null \
            | grep \
              -E \
              '^linux-(image|headers|xanmod-rt-x64v2)' \
            || true

          echo
          echo "Searching /lib/modules..."

          if compgen -G "/lib/modules/*" > /dev/null; then

            find /lib/modules \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -print \
              | sort

          else

            echo "No /lib/modules directories found."

          fi

          echo
          echo "Checking target module directory..."

          if [ -d "/lib/modules/${XANMOD_ACTUAL_RELEASE}" ]; then

            echo
            echo "Target module directory exists:"
            echo "/lib/modules/${XANMOD_ACTUAL_RELEASE}"

            ls -ld \
              "/lib/modules/${XANMOD_ACTUAL_RELEASE}"

          else

            echo
            echo "NOTE:"
            echo "No exact /lib/modules/${XANMOD_ACTUAL_RELEASE} directory."

            echo
            echo "This is NOT a build failure."
            echo "The external module will be compiled directly"
            echo "against the installed XanMod headers."

          fi

          echo
          echo "XanMod kernel package status:"

          if dpkg-query \
            -W \
            -f='${Status}' \
            "${XANMOD_KERNEL_PACKAGE}" \
            2>/dev/null \
            | grep -q "install ok installed"; then

            echo "Installed: YES"

          else

            echo "Installed: NO"
            exit 1

          fi

          echo
          echo "XANMOD MODULE ENVIRONMENT CHECK COMPLETE"


      # ============================================================
      # Verify headers are usable
      # ============================================================

      - name: Verify kernel headers
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFY KERNEL HEADERS"
          echo "=========================================="

          echo
          echo "KERNEL_DIR:"
          echo "${KERNEL_DIR}"

          echo
          echo "Kernel release:"
          make \
            -s \
            -C "${KERNEL_DIR}" \
            kernelrelease

          echo
          echo "Required files:"

          test -f \
            "${KERNEL_DIR}/Makefile"

          test -f \
            "${KERNEL_DIR}/.config"

          test -f \
            "${KERNEL_DIR}/Module.symvers" \
            || echo "NOTE: Module.symvers not present in header package."

          echo
          echo "Header tree is usable."


      # ============================================================
      # Download Diretta source files
      #
      # Only download files required by the external module build.
      # Do NOT attempt to download the directory itself.
      # ============================================================

      - name: Download Diretta ALSA Bridge source
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DOWNLOAD DIRETTA ALSA BRIDGE SOURCE"
          echo "=========================================="

          SOURCE_DIR="${GITHUB_WORKSPACE}/daphile-diretta-build"

          rm -rf "${SOURCE_DIR}"

          mkdir -p "${SOURCE_DIR}"

          echo
          echo "Source base:"
          echo "${DIRETTA_SOURCE_BASE}"

          echo
          echo "Downloading required source files..."

          for file in \
            alsa_bridge.c \
            alsa_bridge.h \
            Makefile; do

            echo
            echo "Downloading:"
            echo "${file}"

            wget \
              --fail \
              --show-progress \
              "${DIRETTA_SOURCE_BASE}/${file}" \
              -O \
              "${SOURCE_DIR}/${file}"

            test -s \
              "${SOURCE_DIR}/${file}"

          done

          echo
          echo "Downloaded source files:"

          ls -lh \
            "${SOURCE_DIR}"

          echo
          echo "=== Makefile ==="

          cat \
            "${SOURCE_DIR}/Makefile"


      # ============================================================
      # Verify source files
      # ============================================================

      - name: Verify Diretta source
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFY DIRETTA SOURCE"
          echo "=========================================="

          SOURCE_DIR="${GITHUB_WORKSPACE}/daphile-diretta-build"

          for file in \
            alsa_bridge.c \
            alsa_bridge.h \
            Makefile; do

            if [ ! -s "${SOURCE_DIR}/${file}" ]; then
              echo
              echo "ERROR: Missing source file:"
              echo "${SOURCE_DIR}/${file}"
              exit 1
            fi

            echo
            echo "OK:"
            echo "${file}"
            wc -c \
              "${SOURCE_DIR}/${file}"

          done

          echo
          echo "Diretta source verified."


      # ============================================================
      # Build alsa_bridge.ko
      # ============================================================

      - name: Build alsa_bridge
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "BUILD ALSA_BRIDGE.KO"
          echo "=========================================="

          SOURCE_DIR="${GITHUB_WORKSPACE}/daphile-diretta-build"

          echo
          echo "Kernel headers:"
          echo "${KERNEL_DIR}"

          echo
          echo "Kernel release:"
          echo "${XANMOD_ACTUAL_RELEASE}"

          echo
          echo "Module source:"
          echo "${SOURCE_DIR}"

          echo
          echo "=== Build ==="

          make \
            -C "${KERNEL_DIR}" \
            ARCH=x86_64 \
            M="${SOURCE_DIR}" \
            modules

          echo
          echo "Build completed."


      # ============================================================
      # Verify module
      # ============================================================

      - name: Verify module
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFY ALSA_BRIDGE MODULE"
          echo "=========================================="

          KO="${GITHUB_WORKSPACE}/daphile-diretta-build/alsa_bridge.ko"

          if [ ! -f "${KO}" ]; then
            echo
            echo "ERROR: alsa_bridge.ko was not created."
            exit 1
          fi

          echo
          echo "Module:"
          ls -lh "${KO}"

          echo
          echo "File type:"
          file "${KO}"

          echo
          echo "Module information:"
          modinfo "${KO}"

          echo
          echo "Vermagic:"
          VERMAGIC="$(modinfo -F vermagic "${KO}")"

          echo "${VERMAGIC}"

          echo
          echo "Expected kernel release:"
          echo "${XANMOD_ACTUAL_RELEASE}"

          case "${VERMAGIC}" in
            "${XANMOD_ACTUAL_RELEASE}"*)
              echo
              echo "Vermagic kernel release matches."
              ;;
            *)
              echo
              echo "ERROR: vermagic kernel release mismatch."
              echo
              echo "Expected prefix:"
              echo "${XANMOD_ACTUAL_RELEASE}"
              echo
              echo "Actual vermagic:"
              echo "${VERMAGIC}"
              exit 1
              ;;
          esac

          echo
          echo "ALSA_BRIDGE MODULE VERIFIED."


      # ============================================================
      # Prepare release files
      # ============================================================

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "PREPARE RELEASE"
          echo "=========================================="

          rm -rf release

          mkdir -p release

          SOURCE_DIR="${GITHUB_WORKSPACE}/daphile-diretta-build"

          cp \
            "${SOURCE_DIR}/alsa_bridge.ko" \
            release/alsa_bridge.ko

          cp \
            "${SOURCE_DIR}/alsa_bridge.c" \
            release/alsa_bridge.c

          cp \
            "${SOURCE_DIR}/alsa_bridge.h" \
            release/alsa_bridge.h

          cp \
            "${SOURCE_DIR}/Makefile" \
            release/Makefile

          printf '%s\n' \
            "${XANMOD_ACTUAL_RELEASE}" \
            > release/kernel.release

          echo
          echo "Release files:"

          ls -lh \
            release


      # ============================================================
      # Build information
      # ============================================================

      - name: Create build info
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CREATE BUILD INFO"
          echo "=========================================="

          BUILD_DATE="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          XANMOD_PACKAGE_VERSION="$(
            dpkg-query \
              -W \
              -f='${Version}' \
              "${XANMOD_KERNEL_PACKAGE}"
          )"

          COMPILER_VERSION="$(
            gcc --version \
              | head -1
          )"

          VERMAGIC="$(
            modinfo \
              -F vermagic \
              release/alsa_bridge.ko
          )"

          printf '%s\n' \
            "Module: alsa_bridge" \
            "Linux kernel package: ${XANMOD_KERNEL_PACKAGE}" \
            "XanMod package version: ${XANMOD_PACKAGE_VERSION}" \
            "Kernel release: ${XANMOD_ACTUAL_RELEASE}" \
            "Architecture: x86_64" \
            "Compiler: ${COMPILER_VERSION}" \
            "Vermagic: ${VERMAGIC}" \
            "Diretta source: ${DIRETTA_SOURCE_BASE}" \
            "Build date: ${BUILD_DATE}" \
            > release/build-info.txt

          echo
          echo "=== build-info.txt ==="

          cat \
            release/build-info.txt


      # ============================================================
      # SHA256
      # ============================================================

      - name: Create checksum
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CREATE SHA256"
          echo "=========================================="

          cd release

          sha256sum \
            alsa_bridge.ko \
            alsa_bridge.c \
            alsa_bridge.h \
            Makefile \
            kernel.release \
            build-info.txt \
            > SHA256SUMS

          echo
          cat SHA256SUMS


      # ============================================================
      # Upload artifact
      # ============================================================

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: alsa-bridge-${{ env.XANMOD_KERNEL_RELEASE }}
          path: release


      # ============================================================
      # Final verification
      # ============================================================

      - name: Final verification
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "FINAL VERIFICATION"
          echo "=========================================="

          echo
          echo "Kernel headers:"
          echo "${KERNEL_DIR}"

          echo
          echo "Kernel release:"
          cat release/kernel.release

          echo
          echo "Module:"
          ls -lh \
            release/alsa_bridge.ko

          echo
          echo "Module vermagic:"
          modinfo \
            -F vermagic \
            release/alsa_bridge.ko

          echo
          echo "=========================================="
          echo "BUILD SUCCESS"
          echo "=========================================="

          echo
          echo "=== Release files ==="

          ls -lh \
            release

          echo
          echo "=== Module info ==="

          modinfo \
            release/alsa_bridge.ko
