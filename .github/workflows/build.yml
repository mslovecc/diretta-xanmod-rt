name: Build Diretta ALSA Bridge for XanMod RT x64v2

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  XANMOD_KERNEL_RELEASE: "6.18.52-rt-x64v2-xanmod1"
  DIRETTA_SOURCE_BASE: "https://gabe.babe123.top/DirettaAlsaHost"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install basic dependencies
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "INSTALL BASIC DEPENDENCIES"
          echo "=========================================="

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            dwarves \
            xz-utils \
            wget \
            curl \
            kmod \
            ca-certificates \
            gnupg

      - name: Add XanMod APT repository
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "ADD XANMOD APT REPOSITORY"
          echo "=========================================="

          sudo mkdir -p /etc/apt/keyrings

          echo "Downloading XanMod repository key..."

          wget -q \
            "https://gabe.babe123.top/archive.key" \
            -O /tmp/xanmod-archive.key

          test -s /tmp/xanmod-archive.key

          echo
          echo "Checking GPG key..."

          gpg --show-keys /tmp/xanmod-archive.key

          gpg \
            --dearmor \
            --yes \
            -o /tmp/xanmod-archive-keyring.gpg \
            /tmp/xanmod-archive.key

          sudo install \
            -m 0644 \
            /tmp/xanmod-archive-keyring.gpg \
            /etc/apt/keyrings/xanmod-archive-keyring.gpg

          echo
          echo "Adding XanMod repository..."

          echo \
            "deb [signed-by=/etc/apt/keyrings/xanmod-archive-keyring.gpg] http://deb.xanmod.org noble main" \
            | sudo tee /etc/apt/sources.list.d/xanmod-release.list

          echo
          echo "Repository configuration:"
          cat /etc/apt/sources.list.d/xanmod-release.list

      - name: Update APT
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "APT UPDATE"
          echo "=========================================="

          sudo apt-get update

      - name: Install XanMod RT x64v2
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "INSTALL XANMOD RT X64V2"
          echo "=========================================="

          sudo apt-get install -y \
            linux-xanmod-rt-x64v2

          echo
          echo "Installed XanMod packages:"
          dpkg -l | grep -E \
            'linux-(image|headers|xanmod-rt-x64v2)' \
            || true

      - name: Detect XanMod RT headers
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DETECT XANMOD RT HEADERS"
          echo "=========================================="

          echo
          echo "Available headers:"
          ls -ld /usr/src/linux-headers-* 2>/dev/null || true

          HEADER_DIR="/usr/src/${XANMOD_KERNEL_RELEASE}"

          echo
          echo "Expected headers:"
          echo "${HEADER_DIR}"

          if [ ! -d "${HEADER_DIR}" ]; then
            echo
            echo "ERROR: Expected XanMod RT headers not found."
            echo
            echo "Installed kernel packages:"
            dpkg -l | grep -E \
              'linux-(image|headers|xanmod-rt-x64v2)' \
              || true

            echo
            echo "Available /usr/src directories:"
            find /usr/src \
              -maxdepth 1 \
              -type d \
              -name 'linux-*' \
              -print \
              | sort

            exit 1
          fi

          echo
          echo "XanMod RT headers found:"
          ls -ld "${HEADER_DIR}"

          echo
          echo "Header Makefile:"
          ls -lh \
            "${HEADER_DIR}/Makefile"

          echo
          echo "Kernel release from headers:"

          make \
            -s \
            -C "${HEADER_DIR}" \
            kernelrelease

          echo
          echo "Expected:"
          echo "${XANMOD_KERNEL_RELEASE}"

          ACTUAL_RELEASE="$(
            make \
              -s \
              -C "${HEADER_DIR}" \
              kernelrelease
          )"

          if [ "${ACTUAL_RELEASE}" != "${XANMOD_KERNEL_RELEASE}" ]; then
            echo
            echo "ERROR: kernel release mismatch"
            echo "Expected: ${XANMOD_KERNEL_RELEASE}"
            echo "Actual:   ${ACTUAL_RELEASE}"
            exit 1
          fi

          echo
          echo "XanMod RT headers are correct."

          echo "KERNEL_DIR=${HEADER_DIR}" >> "${GITHUB_ENV}"

      - name: Download Diretta ALSA Bridge source
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DOWNLOAD DIRETTA ALSA BRIDGE SOURCE"
          echo "=========================================="

          echo
          echo "Source base:"
          echo "${DIRETTA_SOURCE_BASE}"

          rm -rf daphile-diretta-build

          mkdir -p daphile-diretta-build

          cd daphile-diretta-build

          echo
          echo "Downloading required source files..."

          wget -q \
            --show-progress \
            "${DIRETTA_SOURCE_BASE}/alsa_bridge.c" \
            -O alsa_bridge.c

          wget -q \
            --show-progress \
            "${DIRETTA_SOURCE_BASE}/alsa_bridge.h" \
            -O alsa_bridge.h

          wget -q \
            --show-progress \
            "${DIRETTA_SOURCE_BASE}/Makefile" \
            -O Makefile

          echo
          echo "Downloaded source files:"
          ls -lh \
            alsa_bridge.c \
            alsa_bridge.h \
            Makefile

          echo
          echo "=== Makefile ==="
          cat Makefile

          echo
          echo "=== Source line counts ==="

          wc -l \
            alsa_bridge.c \
            alsa_bridge.h \
            Makefile

          echo
          echo "Source download completed."

      - name: Verify source files
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFY DIRETTA SOURCE"
          echo "=========================================="

          for file in \
            alsa_bridge.c \
            alsa_bridge.h \
            Makefile
          do
            if [ ! -s "daphile-diretta-build/${file}" ]; then
              echo
              echo "ERROR: missing or empty source file:"
              echo "${file}"
              exit 1
            fi
          done

          echo
          echo "All required source files are present."

          echo
          echo "Source directory:"
          find daphile-diretta-build \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

      - name: Check kernel build tree
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CHECK XANMOD KERNEL BUILD TREE"
          echo "=========================================="

          echo
          echo "Kernel directory:"
          echo "${KERNEL_DIR}"

          echo
          echo "Kernel release:"
          make \
            -s \
            -C "${KERNEL_DIR}" \
            kernelrelease

          echo
          echo "Expected:"
          echo "${XANMOD_KERNEL_RELEASE}"

          ACTUAL_RELEASE="$(
            make \
              -s \
              -C "${KERNEL_DIR}" \
              kernelrelease
          )"

          if [ "${ACTUAL_RELEASE}" != "${XANMOD_KERNEL_RELEASE}" ]; then
            echo
            echo "ERROR: unexpected kernel release"
            echo "Expected: ${XANMOD_KERNEL_RELEASE}"
            echo "Actual:   ${ACTUAL_RELEASE}"
            exit 1
          fi

          echo
          echo "Kernel release is correct."

          echo
          echo "Kernel configuration:"
          if [ -f "${KERNEL_DIR}/.config" ]; then
            ls -lh "${KERNEL_DIR}/.config"
          else
            echo "WARNING: .config not found in header tree."
          fi

          echo
          echo "Module.symvers:"
          if [ -f "${KERNEL_DIR}/Module.symvers" ]; then
            ls -lh "${KERNEL_DIR}/Module.symvers"
          else
            echo "WARNING: Module.symvers not found."
          fi

      - name: Build alsa_bridge
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "BUILD ALSA_BRIDGE"
          echo "=========================================="

          echo
          echo "Kernel:"
          echo "${KERNEL_DIR}"

          echo
          echo "Kernel release:"
          make \
            -s \
            -C "${KERNEL_DIR}" \
            kernelrelease

          echo
          echo "Module source:"
          find daphile-diretta-build \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

          echo
          echo "=========================================="
          echo "MAKEFILE"
          echo "=========================================="

          cat daphile-diretta-build/Makefile

          echo
          echo "=========================================="
          echo "BUILD"
          echo "=========================================="

          make \
            -C "${KERNEL_DIR}" \
            ARCH=x86_64 \
            M="${GITHUB_WORKSPACE}/daphile-diretta-build" \
            modules

      - name: Verify module
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFY ALSA_BRIDGE MODULE"
          echo "=========================================="

          KO="${GITHUB_WORKSPACE}/daphile-diretta-build/alsa_bridge.ko"

          echo
          echo "Module:"
          echo "${KO}"

          if [ ! -f "${KO}" ]; then
            echo
            echo "ERROR: alsa_bridge.ko was not created."
            exit 1
          fi

          echo
          echo "Module file:"
          ls -lh "${KO}"

          echo
          echo "File type:"
          file "${KO}"

          echo
          echo "=========================================="
          echo "MODINFO"
          echo "=========================================="

          modinfo "${KO}"

          echo
          echo "=========================================="
          echo "VERMAGIC"
          echo "=========================================="

          VERMAGIC="$(
            modinfo \
              -F vermagic \
              "${KO}"
          )"

          echo "${VERMAGIC}"

          echo
          echo "Expected kernel:"
          echo "${XANMOD_KERNEL_RELEASE}"

          case "${VERMAGIC}" in
            "${XANMOD_KERNEL_RELEASE}"*)
              echo
              echo "VERMAGIC kernel release is correct."
              ;;
            *)
              echo
              echo "ERROR: VERMAGIC does not match XanMod RT kernel."
              echo "Expected prefix: ${XANMOD_KERNEL_RELEASE}"
              echo "Actual: ${VERMAGIC}"
              exit 1
              ;;
          esac

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "PREPARE RELEASE FILES"
          echo "=========================================="

          rm -rf release

          mkdir -p release

          cp \
            daphile-diretta-build/alsa_bridge.ko \
            release/alsa_bridge.ko

          cp \
            daphile-diretta-build/alsa_bridge.c \
            release/alsa_bridge.c

          cp \
            daphile-diretta-build/alsa_bridge.h \
            release/alsa_bridge.h

          cp \
            daphile-diretta-build/Makefile \
            release/Makefile

          make \
            -s \
            -C "${KERNEL_DIR}" \
            kernelrelease \
            > release/kernel.release

          echo
          echo "Release kernel:"
          cat release/kernel.release

          echo
          echo "Release files:"
          ls -lh release

      - name: Create build info
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CREATE BUILD INFO"
          echo "=========================================="

          KERNEL_RELEASE_ACTUAL="$(
            cat release/kernel.release
          )"

          COMPILER_VERSION="$(
            gcc --version | head -1
          )"

          BUILD_DATE="$(
            date -u '+%Y-%m-%d %H:%M:%S UTC'
          )"

          printf '%s\n' \
            "Kernel release: ${KERNEL_RELEASE_ACTUAL}" \
            "Kernel family: XanMod RT x64v2" \
            "Module: alsa_bridge" \
            "Compiler: ${COMPILER_VERSION}" \
            "Build date: ${BUILD_DATE}" \
            "Source: ${DIRETTA_SOURCE_BASE}" \
            > release/build-info.txt

          echo
          cat release/build-info.txt

      - name: Create checksum
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CREATE SHA256"
          echo "=========================================="

          cd release

          sha256sum \
            alsa_bridge.ko \
            alsa_bridge.c \
            alsa_bridge.h \
            Makefile \
            kernel.release \
            build-info.txt \
            > SHA256SUMS

          echo
          cat SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: alsa-bridge-${{ env.XANMOD_KERNEL_RELEASE }}
          path: release

      - name: Final verification
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "FINAL VERIFICATION"
          echo "=========================================="

          echo
          echo "Kernel:"
          cat release/kernel.release

          echo
          echo "Module:"
          ls -lh release/alsa_bridge.ko

          echo
          echo "Module vermagic:"
          modinfo \
            -F vermagic \
            release/alsa_bridge.ko

          echo
          echo "=========================================="
          echo "BUILD SUCCESS"
          echo "=========================================="

          echo
          echo "Release files:"
          ls -lh release
